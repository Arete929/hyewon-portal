<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>혜원포털 관리자</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/admin-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/admin-180.png?v=2">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0F3B34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="혜원 관리자">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  :root {
    --bg:#EEF2F6; --surface:#FFFFFF; --text:#14231F; --text2:#5F6F6B; --text3:#9AA8A4;
    --border:#E1E7EC; --accent:#15524A; --accent-dark:#0E3C36; --mint:#2FBF8A; --yel:#F2B705;
    --success-bg:#E7F6EC; --success-text:#1F7A3D;
    --error-bg:#FDEBEB; --error-text:#C22B2B;
    --warn-bg:#FFF4E0; --warn-text:#9A6400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; }
  .serif { font-family: 'Gugi', 'Noto Sans KR', sans-serif; font-weight: 400; letter-spacing: .01em; }
  #app { min-height: 100vh; }
  .shell { display: flex; min-height: 100vh; }
  .side { width: 232px; flex-shrink: 0; background: linear-gradient(180deg, #0F3B34 0%, #0B2C27 100%); color: #CFE3DC; padding: 0 14px 18px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side .photo { position: relative; height: 170px; margin: 0 -14px; flex: none; background: url(../assets/login-bg.webp) 34% 22% / cover; }
  .side .photo:after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,59,52,0) 30%, rgba(15,59,52,.75) 72%, #0F3B34 100%); }
  .side .brandbox { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; margin: -44px 4px 18px; }
  .side .brandbox img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.35); flex: none; background: #fff; }
  .side .brandbox .gugi { display: block; color: #fff; font-size: 22px; line-height: 1.1; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .gugi { font-family: 'Gugi', sans-serif; font-weight: 400; letter-spacing: .01em; }
  .side .brandbox small { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; color: #0F3B34; background: #FFD84A; border-radius: 999px; padding: 1px 9px; }
  .side button.nav { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: none; color: #CFE3DC; font-family: inherit; font-size: 15px; font-weight: 700; padding: 7px 10px; border-radius: 14px; cursor: pointer; margin-bottom: 4px; position: relative; }
  .side button.nav .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; }
  .side button.nav:hover { background: rgba(255,255,255,.06); color: #fff; }
  .side button.nav.on { background: rgba(255,255,255,.1); color: #fff; }
  .side button.nav.on:after { content: ''; position: absolute; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: #FFD84A; }
  .side a.sub, .side button.sub { display: flex; align-items: center; gap: 8px; background: none; border: none; color: #9DBDB2; font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer; text-decoration: none; text-align: left; }
  .side a.sub:hover, .side button.sub:hover { color: #fff; background: rgba(255,255,255,.06); }
  .side .spacer { flex: 1; min-height: 16px; }
  .pillbtn { border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-family: inherit; font-size: 13px; font-weight: 700; background: #fff; color: var(--text2); cursor: pointer; }
  .pillbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pillbtn:disabled { opacity: .6; cursor: default; }
  .verbox { margin: 8px 12px 0; font-size: 10.5px; line-height: 1.6; color: #7FA596; }
  .verbox b { color: #A9C4B9; font-weight: 600; }
  .verfoot { display: none; font-size: 11px; line-height: 1.7; color: var(--text3); padding: 0 16px 28px; }
  .verfoot b { color: var(--text2); font-weight: 600; }
  .main { flex: 1; min-width: 0; }
  .main .wrap { max-width: 1000px; }
  .wrap { padding: 28px 28px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px 18px; }
  .stat span { display: block; font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 6px; }
  .stat b { font-size: 26px; }
  .stat b.small { font-size: 15px; }
  .grid2 { margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .grid2 .card { max-width: none; margin-bottom: 0; }
  .bnav, .sheet, .sheetbg { display: none; }
  .hello { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .hello .av { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .hello h1 { font-size: 17px; margin: 0; line-height: 1.25; flex: 1; }
  .hello small { display: block; font-size: 11px; color: var(--text2); font-weight: 400; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .kpi { background: #fff; border-radius: 22px; padding: 14px 16px; }
  .kpi span { font-size: 12px; color: var(--text2); }
  .kpi b { display: block; font-size: 28px; margin-top: 2px; }
  .kpi em { font-style: normal; display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-top: 4px; }
  .kpi em.up { background: #DDF5EB; color: #12805B; } .kpi em.dn { background: #FDE3E1; color: #C22B2B; }
  .focus { background: var(--accent); color: #fff; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; cursor: pointer; }
  .focus h3 { font-size: 15px; margin: 0; } .focus p { font-size: 12px; opacity: .82; margin: 4px 0 0; line-height: 1.6; }
  .focus .ring { flex: none; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .tag.ok { background: #DDF5EB; color: #12805B; } .tag.wr { background: #FFF1C7; color: #8a6500; } .tag.no { background: #FDE3E1; color: #C22B2B; }
  .tcard { background: #fff; border-radius: 22px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; }
  .tcard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .pbar { height: 12px; border-radius: 999px; background: #DDE5E2; overflow: hidden; margin: 10px 0 6px; }
  .pbar i { display: block; height: 100%; background: var(--mint); border-radius: 999px; }
  .tcard .sub { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); }
  .hnav { margin: 4px 0 10px; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; }
  .hnav span { font-size: 12px; color: var(--text3); font-weight: 400; }
  .subm { display: none; }
  @media (max-width: 1180px) { .subm { display: block; } .subm ~ .tablewrap { display: none; } .subm ~ .hint { display: none; } }
  .chips { display: flex; gap: 8px; margin: 0 0 12px; overflow-x: auto; }
  .chips button { border: 0; background: #fff; border-radius: 999px; padding: 8px 14px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer; white-space: nowrap; }
  .chips button.on { background: var(--accent); color: #fff; }
  .srow { background: #fff; border-radius: 18px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .srow .dot { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .srow .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
  .srow .t small { display: block; color: var(--text2); font-size: 11px; font-weight: 400; margin-top: 2px; }
  @media (max-width: 760px) {
    body { padding-bottom: 96px; }
    .shell { flex-direction: column; }
    .side { display: none; }
    .verfoot { display: block; }
    .wrap { padding: 18px 16px 24px; }
    .bnav { display: flex; position: fixed; left: 14px; right: 14px; bottom: 14px; height: 62px; background: #fff; border-radius: 999px; box-shadow: 0 6px 20px rgba(20,35,31,.16); justify-content: space-around; align-items: center; z-index: 50; padding: 0 6px; }
    .bnav button { border: 0; background: none; font-family: inherit; font-size: 10px; font-weight: 600; color: var(--text2); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
    .bnav button.on { background: var(--accent); color: #fff; }
    .sheetbg.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 60; }
    .sheet.open { display: block; position: fixed; left: 14px; right: 14px; bottom: 88px; background: #fff; border-radius: 22px; padding: 8px; z-index: 61; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .sheet button, .sheet a { display: block; width: 100%; text-align: left; background: none; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--text); padding: 14px 16px; border-radius: 14px; text-decoration: none; cursor: pointer; }
    .sheet button:active, .sheet a:active { background: var(--bg); }
  }
  .center-pad { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 700; margin: 0 0 12px; }
  .lead { font-size: 13px; color: var(--text2); margin: 0 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 22px 20px; margin-bottom: 16px; max-width: 440px; }
  .card.wide { max-width: none; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  label { font-size: 13px; font-weight: 600; color: var(--text2); }
  input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 11px 13px; font-size: 14px; border: 1px solid var(--border); border-radius: 9px; background: #FCFCFB; font-family: inherit; color: var(--text); }
  textarea { min-height: 160px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(21,82,74,0.16); }
  .btn { display: inline-flex; align-items: center; gap: 6px; text-align: center; text-decoration: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 9px; border: none; cursor: pointer; font-family: inherit; }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-outline { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--text); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border); cursor: pointer; font-family: inherit; }
  .btn-danger { color: var(--error-text); border-color: rgba(194,43,43,.35); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--text3); }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  .msg.error { background: var(--error-bg); color: var(--error-text); }
  .msg.ok { background: var(--success-bg); color: var(--success-text); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-text); }
  .list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .list a.item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: var(--text); font-weight: 600; font-size: 15px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .pill.open { color: var(--success-text); background: var(--success-bg); }
  .pill.wait, .pill.closed { color: var(--text2); background: #EFEDE7; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tabs button { background: none; border: none; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: #FAFAF8; color: var(--text2); font-weight: 700; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .tablewrap { overflow-x: auto; margin-bottom: 16px; }
  .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; }
  .linkcard .lc-body { display: flex; gap: 16px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .linkcard .lc-qr img { width: 132px; height: 132px; image-rendering: pixelated; background: #fff; border: 1px solid var(--border); border-radius: 12px; display: block; }
  .linkcard .lc-short { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: .01em; word-break: break-all; }

  /* ===== 반응형: 폴드(펼침 ≈ 880px)·태블릿 / 터치 화면 ===== */
  .row > .btn, .row > .btn-outline { flex: none; white-space: nowrap; }
  @media (min-width: 761px) and (max-width: 1180px) {
    .side { width: 204px; padding: 0 10px 14px; }
    .side .photo { height: 140px; margin: 0 -10px; }
    .side .brandbox { margin: -40px 2px 14px; }
    .side .brandbox .gugi { font-size: 19px; }
    .side button.nav { font-size: 14px; padding: 6px 8px; gap: 10px; }
    .wrap { padding: 22px 20px 48px; }
    .grid2 { grid-template-columns: 1fr; }
  }
  @media (pointer: coarse) {
    .btn-sm { padding: 9px 13px; font-size: 13px; }
    .pillbtn { padding: 8px 14px; }
    .tp-chip { padding: 8px 13px; }
    input[type=text], input[type=password], input[type=number], input[type=datetime-local], select { min-height: 44px; }
    .tabs button { padding: 12px 14px; }
  }
  @media (max-width: 760px) {
    .row { flex-wrap: wrap; }
    .linkcard .lc-body { gap: 12px; flex-direction: column; align-items: stretch; }
    .linkcard .lc-qr img { width: 160px; height: 160px; margin: 0 auto; }
    .linkcard .lc-body > div:last-child { text-align: center; }
    .linkcard .lc-body .row { justify-content: center; }
    .linkcard .lc-short { font-size: 16px; }
    h1.serif { font-size: 20px; }
  }
  .linkcard .lc-short { overflow-wrap: anywhere; word-break: normal; }

  /* QR 크게 보기 (교실 화면·폰 보여주기용) */
  .qrbig { position: fixed; inset: 0; z-index: 100; background: #0B2C27; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  .qrbig .qb-title { font-size: clamp(20px, 4vw, 40px); font-weight: 800; line-height: 1.3; max-width: 92vw; }
  .qrbig .qb-code { background: #fff; padding: clamp(12px, 2vw, 24px); border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .qrbig .qb-code svg { display: block; width: min(72vw, 62vh); height: min(72vw, 62vh); }
  .qrbig .qb-url { font-size: clamp(18px, 3.6vw, 40px); font-weight: 800; color: #5FE3D8; letter-spacing: .01em; overflow-wrap: anywhere; }
  .qrbig .qb-hint { font-size: 14px; color: #A9C4B9; }
  .qrbig .qb-close { position: absolute; top: 14px; right: 14px; width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(255,255,255,.14); color: #fff; font-size: 24px; cursor: pointer; }
  .qrbig .qb-full { position: absolute; top: 14px; left: 14px; height: 48px; padding: 0 16px; border-radius: 999px; border: none; background: rgba(255,255,255,.14); color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  @media (orientation: landscape) and (min-width: 700px) {
    .qrbig { flex-direction: row; gap: 5vw; text-align: left; }
    .qrbig .qb-text { max-width: 40vw; display: flex; flex-direction: column; gap: 14px; }
    .qrbig .qb-code svg { width: min(44vw, 78vh); height: min(44vw, 78vh); }
  }
  .rvsheet { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
  .rv-panel { background: #fff; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 18px 28px; box-shadow: 0 -10px 30px rgba(0,0,0,.2); }
  @media (min-width: 761px) { .rvsheet { align-items: center; } .rv-panel { border-radius: 22px; } }
  .rv-head { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .rv-x { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--bg); font-size: 16px; cursor: pointer; }
  .rv-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .rv-btns > * { flex: 1; justify-content: center; min-width: 96px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: flex; gap: 10px; position: relative; padding-bottom: 14px; }
  .tl li:not(:last-child):before { content: ''; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--border); }
  .tl-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; flex: none; color: #fff; }
  .tl-body { font-size: 13px; line-height: 1.5; min-width: 0; }
  .tl-note { margin-top: 4px; background: var(--bg); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; }
  .up-path { font-size: 15px; font-weight: 700; color: var(--accent); overflow-wrap: anywhere; }
  .tile { padding: 16px 18px; margin-bottom: 14px; }
  .tile-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .dt-head { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .dt-title { margin: 0; font-size: clamp(24px, 4.2vw, 34px); line-height: 1.25; word-break: keep-all; overflow-wrap: anywhere; }
  .dt-icon { position: relative; flex: none; width: 60px; height: 60px; border-radius: 18px; border: 1px solid var(--border); background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .dt-icon i { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 6px; white-space: nowrap; opacity: .9; }
  .dt-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .tico { display: inline-flex; align-items: center; justify-content: center; line-height: 1; object-fit: contain; border-radius: 6px; vertical-align: middle; flex: none; }
  .item-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .icon-panel { margin-top: 12px; background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 14px; max-width: 720px; }
  .ip-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .ip-sec { font-size: 13px; font-weight: 700; margin: 10px 0 6px; }
  .ip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
  .ip-cell { position: relative; height: 52px; border: 1px solid var(--border); border-radius: 12px; background: #fff; display: grid; place-items: center; cursor: pointer; padding: 4px; font-size: 26px; }
  .ip-cell img { width: 38px; height: 38px; object-fit: contain; }
  .ip-cell.on { border: 2px solid var(--accent); background: var(--accent-soft, #E3F1EC); }
  .ip-cell.lib { height: 74px; cursor: default; grid-template-rows: 1fr auto; }
  .ip-cell.lib small { font-size: 10px; color: var(--text3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

// ---------- 버전 · 배포 시각 표시 ----------
// 화면: GitHub 의 최신 커밋(= GitHub Pages 가 배포하는 내용) 시각. 푸시 후 반영까지 1~2분 걸릴 수 있어요.
// 서버: Apps Script 를 자동 배포할 때 기록한 시각과 커밋. 편집기에서 직접 올린 코드는 «기록 없음».
const WEB_REPO = 'Arete929/hyewon-portal';
state.ver = { loaded: false, loading: false, web: null, server: null };

function fmtIsoKst_(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const p = {};
  new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
  return p.month + '/' + p.day + ' ' + p.hour + ':' + p.minute;
}
function fmtStampShort_(t) {
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(String(t || ''));
  return m ? (Number(m[2]) + '/' + Number(m[3]) + ' ' + m[4]) : '';
}
function verHtml_(sep) {
  const v = state.ver;
  const web = v.web ? ('<b>' + escapeHtml(v.web.sha) + '</b> · ' + escapeHtml(v.web.time)) : (v.loaded ? '확인 못 함' : '확인 중…');
  let server;
  if (v.server) {
    const t = fmtStampShort_(v.server.buildTime);
    server = '<b>v' + escapeHtml(String(v.server.version)) + '</b> · ' + (t ? escapeHtml(t) + (v.server.commit ? ' (' + escapeHtml(v.server.commit) + ')' : '') : '배포 기록 없음');
  } else { server = v.loaded ? '확인 못 함' : '확인 중…'; }
  return '화면 ' + web + sep + '서버 ' + server;
}
// 학생 화면과 같은 짧은 형식: «혜원포털 · v30 · 배포 2026-11-03 00:05 (KST)» (화면·서버 중 더 나중 시각)
function verCompact_() {
  const v = state.ver;
  if (!v.loaded) return '혜원포털 · 버전 확인 중…';
  const times = [v.web && v.web.full, v.server && v.server.buildTime].filter(function (t) { return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(t || ''); }).sort();
  return ['혜원포털', v.server ? 'v' + v.server.version : '', times.length ? '배포 ' + times[times.length - 1] + ' (KST)' : ''].filter(Boolean).join(' · ');
}
function paintVer_() {
  const box = document.getElementById('verBox');
  if (box) box.textContent = verCompact_();
  const foot = document.getElementById('verFoot');
  if (foot) foot.innerHTML = escapeHtml(verCompact_()) + '<br>ⓒKIM.JIN.HO';
  const line = document.getElementById('verLine');
  if (line) line.innerHTML = verHtml_(' &nbsp;·&nbsp; ');
}
async function loadVersionInfo_() {
  const v = state.ver;
  if (v.loaded || v.loading || !state.exec) return;
  v.loading = true;
  try {
    if (state.token) {
      const st = await api('getPortalStatus');
      if (st && st.success) v.server = { version: st.serverVersion, buildTime: st.buildTime || '', commit: st.buildCommit || '' };
    } else {
      const st = await apiGet('authStatus');   // 로그인 전 — 공개 정보(버전·배포 시각)만
      if (st && st.ok) v.server = { version: st.serverVersion, buildTime: st.buildTime || '', commit: '' };
    }
  } catch (e) {}
  try {
    const r = await fetch('https://api.github.com/repos/' + WEB_REPO + '/commits/main', { headers: { Accept: 'application/vnd.github+json' } });
    if (r.ok) {
      const j = await r.json();
      const t = fmtIsoKst_(j && j.commit && j.commit.committer && j.commit.committer.date);
      if (j && j.sha && t) {
        const p = {};
        new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
          .formatToParts(new Date(j.commit.committer.date)).forEach(function (x) { p[x.type] = x.value; });
        v.web = { sha: String(j.sha).slice(0, 7), time: t, full: p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute };
      }
    }
  } catch (e) {}
  v.loading = false; v.loaded = true;
  paintVer_();
}

async function api(action, data, opts) {
  opts = opts || {};
  const body = new URLSearchParams();
  body.set('action', action);
  const payload = Object.assign({}, data || {});
  if (state.token && !opts.noToken) payload.token = state.token;
  body.set('data', JSON.stringify(payload));
  const res = await fetch(state.exec, { method: 'POST', body: body });
  const json = await res.json();
  if (json && json.error === 'unauthorized') {
    state.token = '';
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    renderLogin('세션이 끊어졌습니다. 다시 로그인해주세요.');
    throw new Error('unauthorized');
  }
  try { if (json && json.success === true && SAVE_LABELS[action] && !(action === 'autoRoster' && !payload.apply)) markSaved_(SAVE_LABELS[action], payload.tabName, action); } catch (e) {}
  return json;
}

function showBigQr_(title, url) {
  if (!window.qrcode) return;
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const svg = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  const el = document.createElement('div');
  el.className = 'qrbig';
  el.innerHTML = '<button class="qb-full" type="button">⛶ 전체 화면</button><button class="qb-close" type="button" aria-label="닫기">✕</button>' +
    '<div class="qb-code">' + svg + '</div>' +
    '<div class="qb-text"><div class="qb-title">' + escapeHtml(title) + '</div>' +

  document.body.appendChild(el);
  function close() {
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    el.remove(); document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  el.querySelector('.qb-close').onclick = close;
  el.onclick = function (e) { if (e.target === el) close(); };
  const fs = el.querySelector('.qb-full');
  if (!el.requestFullscreen) fs.style.display = 'none';
  fs.onclick = function () { try { el.requestFullscreen(); fs.style.display = 'none'; } catch (e) {} };
}

// ---------- 대상 학생 요약 (과제 화면 🎯 대상 타일) ----------
// 개별 학생: 이름까지 전부 · 학년/학급/전교생: «몇 반 몇 명» · 빠진 학생은 «그 반에서 누구 제외»로.
function idKey_(v) { const s = String(v == null ? '' : v).trim(); return /^\d+$/.test(s) ? String(Number(s)) : s; }

  const hasRoster = roster.length > 0;

  (excl || []).forEach(function (x) { (exByClass[x.grade + '-' + x.cls] = exByClass[x.grade + '-' + x.cls] || []).push(x); });
  const ones = tg.filter(function (t) { return t.length === 4; });
  const groups = tg.filter(function (t) { return t.length !== 4; });
  let classes = [];
  if (!tg.length) classes = Object.keys(byClass).filter(function (k) { return !hasRoster || byClass[k].some(function (x) { return inRoster[idKey_(x.studentId)]; }); });
  groups.forEach(function (t) {
    if (/^\d$/.test(t)) Object.keys(byClass).forEach(function (k) { if (k.split('-')[0] === t) classes.push(k); });
    else classes.push(t);
  });
  classes = classes.filter(function (k, i) { return classes.indexOf(k) === i; }).sort(clsSort_);
  const covered = {}, out = { classes: [], ones: [], extras: [], hasRoster: hasRoster, total: 0 };
  classes.forEach(function (k) {
    const mem = byClass[k] || [];
    const inc = hasRoster ? mem.filter(function (x) { return inRoster[idKey_(x.studentId)]; }) : mem;
    const miss = hasRoster ? mem.filter(function (x) { return !inRoster[idKey_(x.studentId)]; }) : [];
    inc.forEach(function (x) { covered[idKey_(x.studentId)] = 1; });
    out.classes.push({ key: k, g: k.split('-')[0], c: k.split('-')[1], n: inc.length, miss: miss, ex: exByClass[k] || [] });
    out.total += inc.length;

  ones.forEach(function (id) {
    const k = idKey_(id); if (covered[k]) return; covered[k] = 1;
    const x = byId[k] || inRoster[k] || { studentId: id, name: '' };
    out.ones.push({ studentId: String(x.studentId || id), name: x.name || '', cls: String(id).charAt(0) + '-' + String(id).charAt(1), noRoster: hasRoster && !inRoster[k], noSrc: !byId[k] });
    out.total++;
  });
  if (hasRoster) roster.forEach(function (e) {
    const k = idKey_(e.studentId); if (covered[k]) return; covered[k] = 1;
    out.extras.push({ studentId: e.studentId, name: e.name }); out.total++;

function stuChip_(x, note) { return '<span class="ts-stu">' + escapeHtml(x.studentId) + ' ' + escapeHtml(x.name || '') + (note ? ' <i>' + escapeHtml(note) + '</i>' : '') + '</span>'; }

}

      catch (e) { const t = document.getElementById('annText'); t.focus(); t.select(); msg.textContent = '자동 복사가 막혔어요. 선택된 글을 길게 눌러(Ctrl+C) 복사해 주세요.'; }
    };
  }
  box.style.display = '';
  paint();
}

// ---------- 과제 알림 보내기 (🔔 학생 알림 타일) ----------
async function wirePushTile_(tabName) {
  const info = document.getElementById('pushInfo'); if (!info) return;
  let r = null;
  try { r = await api('getTaskPushInfo', { tabName: tabName }); } catch (e) {}
  if (document.getElementById('pushInfo') !== info) return;
  const btnA = document.getElementById('pushAll'), btnM = document.getElementById('pushMiss');
  if (!r || r.success !== true) { info.textContent = '서버(Code.gs) 버전 40 이상에서 쓸 수 있어요.'; btnA.disabled = btnM.disabled = true; return; }
  if (!r.pushReady) { info.innerHTML = '푸시 서버가 아직 설정되지 않았어요.'; btnA.disabled = btnM.disabled = true; return; }
  info.innerHTML = (r.all ? '대상이 정해지지 않아 <b>알림 켠 모든 학생</b>에게 가요 · ' : '대상 ' + r.targets + '명 중 ') + '알림 켠 학생 <b>' + r.notiOn + '명</b>' +
    ' · 안 낸 학생 중 <b>' + r.missingOn + '명</b>' + (r.auto && r.auto.open ? ' · <span style="color:var(--accent);">자동 알림 켜짐</span>' : '');
  async function send(onlyMissing) {
    const n = onlyMissing ? r.missingOn : r.notiOn;
    if (!n) { document.getElementById('pushMsg').textContent = '받을 학생이 없어요(알림을 켠 학생이 없어요).'; return; }
    if (!confirm((onlyMissing ? '아직 안 낸 학생 ' : '대상 학생 ') + n + '명의 휴대폰으로 알림을 보낼까요?')) return;
    const msg = document.getElementById('pushMsg'); msg.textContent = '보내는 중…'; btnA.disabled = btnM.disabled = true;
    let res;
    try { res = await api('notifyTask', { tabName: tabName, title: document.getElementById('pushTitle').value, body: document.getElementById('pushBody').value, onlyMissing: onlyMissing }); } catch (e) { res = null; }
    btnA.disabled = btnM.disabled = false;
    msg.textContent = (res && res.message) || '보내지 못했어요.';
  }
  btnA.onclick = function () { send(false); };
  btnM.onclick = function () { send(true); };
}

// ---------- 대상 고르기 (학년 전체 / 반) — 새 과제 만들기·과제 화면에서 같이 써요 ----------
async function loadSourceStudents_() {
  if (srcState.students && srcState.students.length) return srcState.students;
  try { const r = await api('getSourceRoster'); if (r && r.success) { srcState.students = r.students || []; srcState.title = r.title || ''; srcState.excluded = r.excludedList || []; } } catch (e) {}
  return srcState.students || [];
}
// 화면에 <div id="..."></div> 를 두고 부르면 칩을 그려요. el._targets() 로 고른 값(['3'] 또는 ['3-1','3-2'])을 읽어요.
async function mountTargetPicker_(id, initial, onChange) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<span class="hint">학생명단 시트를 읽는 중…</span>';
  const students = await loadSourceStudents_();
  if (!document.getElementById(id)) return;
  const grades = {};   // grades[g][c] = [학생…]
  students.forEach(function (x) { const g = String(x.grade), c = String(x.cls); grades[g] = grades[g] || {}; (grades[g][c] = grades[g][c] || []).push(x); });
  if (!Object.keys(grades).length) ['1', '2', '3'].forEach(function (g) { grades[g] = {}; for (let c = 1; c <= 5; c++) grades[g][c] = []; });
  const sel = {};   // '3'(학년 전체) · '3-2'(반 전체) · '3205'(학생 한 명) → true
  (initial || []).forEach(function (t) { sel[String(t)] = true; });
  const gKeys = Object.keys(grades).sort();
  let pickG = gKeys[gKeys.length - 1], pickC = Object.keys(grades[pickG] || {}).sort(function (a, b) { return a - b; })[0] || '1';
  const first = (initial || []).find(function (t) { return String(t).length === 4; });
  if (first) { pickG = String(first)[0]; pickC = String(first)[1]; }
  // 고르는 방식: 전교생(all) · 학년 전체(grade) · 학급 전체(class) · 개별(mix — 학년·반·학생을 섞어서)
  const init = Object.keys(sel);
  let mode = !init.length ? 'all' : init.some(function (k) { return k.length === 4; }) ? 'mix' : init.every(function (k) { return /^[1-9]$/.test(k); }) ? 'grade' : 'class';
  if (mode === 'mix') Object.keys(sel).forEach(function (k) { if (k.length !== 4) delete sel[k]; });   // 개별은 학생만
  function setMode(m) {
    mode = m;
    Object.keys(sel).forEach(function (k) {
      const keep = (m === 'mix' && k.length === 4) || (m === 'grade' && /^[1-9]$/.test(k)) || (m === 'class' && /^[1-9]-[1-9]$/.test(k));
      if (!keep) delete sel[k];
    });
    changed();
  }
  function covered(x) { return !!(sel[String(x.grade)] || sel[x.grade + '-' + x.cls]); }
  function picked(x) { return covered(x) || !!sel[x.studentId]; }
  function count() { return students.filter(picked).length; }
  function targets() { return Object.keys(sel).filter(function (k) { return sel[k]; }).sort(); }
  function onesIn(g, c) { return (grades[g][c] || []).filter(function (x) { return sel[x.studentId]; }).length; }
  function paint() {
    const modes = [['all', '🏫 전교생'], ['grade', '학년 전체'], ['class', '학급 전체'], ['mix', '👤 개별 학생']];
    const seg = '<div class="tp-seg">' + modes.map(function (m) { return '<button type="button" data-mode="' + m[0] + '"' + (mode === m[0] ? ' class="on"' : '') + '>' + m[1] + '</button>'; }).join('') + '</div>';
    if (mode === 'all') {
      el.innerHTML = seg + '<p class="hint" style="margin:8px 0 0;">전교생' + (students.length ? ' ' + students.length + '명' : '') + '이 대상이에요(대상 제한 없음).</p>';
      wireSeg(); return;
    }
    const showGrade = mode === 'grade', showClass = mode === 'class', showOnes = mode === 'mix';
    const ones = students.filter(function (x) { return sel[x.studentId]; });
    el.innerHTML = seg + '<div style="margin-top:10px;">' + (showOnes ? '' : gKeys.map(function (g) {
      const total = Object.keys(grades[g]).reduce(function (a, c) { return a + grades[g][c].length; }, 0);
      return '<div class="tp-row">' + (!showGrade ? '<span class="tp-glabel">' + g + '학년</span>' : '') + (showGrade ? '<button type="button" class="tp-chip all' + (sel[g] ? ' on' : '') + '" data-t="' + g + '">' + g + '학년 전체' + (total ? ' <i>' + total + '</i>' : '') + '</button>' : '') +
        (!showClass ? '' : Object.keys(grades[g]).sort(function (a, b) { return a - b; }).map(function (c) {
          const k = g + '-' + c, n = onesIn(g, c);
          return '<button type="button" class="tp-chip' + (sel[k] ? ' on' : '') + (sel[g] ? ' dim' : '') + '" data-t="' + k + '">' + c + '반' +
            (n ? ' <i style="opacity:1;color:var(--accent);font-weight:800;">' + n + '명</i>' : (grades[g][c].length ? ' <i>' + grades[g][c].length + '</i>' : '')) + '</button>';
        }).join('')) + '</div>';
    }).join('')) + '</div>' +
    (showOnes ? '<div class="tp-picked"><span class="hint">' + (ones.length ? '고른 학생 ' + ones.length + '명:' : '아래에서 학생을 눌러 고르세요. 여러 학년·반을 섞어도 돼요.') + '</span> ' + ones.map(function (x) { return '<button type="button" class="tp-chip on" data-s="' + escapeHtml(x.studentId) + '">' + escapeHtml(x.studentId) + ' ' + escapeHtml(x.name) + ' ✕</button>'; }).join('') + '</div>' : '') +
    (showOnes && students.length ? '<div class="tp-ind"><div class="tp-ind-head">👤 학생 한 명씩 고르기 <span class="hint" style="font-weight:400;">학년·반을 누르고 학생을 눌러서 넣고 빼요</span></div>' +
        '<div class="tp-pick">' + gKeys.map(function (g) { return '<button type="button" class="tp-pb' + (g === pickG ? ' on' : '') + '" data-pg="' + g + '">' + g + '학년</button>'; }).join('') + '</div>' +
        '<div class="tp-pick">' + Object.keys(grades[pickG] || {}).sort(function (a, b) { return a - b; }).map(function (c) {
          const n = onesIn(pickG, c);
          return '<button type="button" class="tp-pb' + (c === pickC ? ' on' : '') + '" data-pc="' + c + '">' + c + '반' + (n ? ' <i>' + n + '</i>' : '') + '</button>';
        }).join('') + '</div>' +
      '<div class="tp-stu">' + ((grades[pickG] || {})[pickC] || []).map(function (x) {
          const cov = covered(x);
          return '<button type="button" class="tp-chip' + (cov ? ' cov' : sel[x.studentId] ? ' on' : '') + '" data-s="' + escapeHtml(x.studentId) + '">' + escapeHtml(x.studentId) + ' ' + escapeHtml(x.name) + '</button>';
        }).join('') + '</div></div>' : '') +
    '<p class="hint" style="margin:6px 0 0;">' + (targets().length ? '고른 대상: <b>' + escapeHtml(targetsLabel_(targets())) + '</b>' + (students.length ? ' · ' + count() + '명' : '') : '아무것도 안 고르면 대상 제한이 없어요(전교생).') + '</p>';
    wireSeg();
    el.querySelectorAll('[data-t]').forEach(function (b) {
      b.onclick = function () {
        const k = b.getAttribute('data-t'), g = k.split('-')[0];
        if (k.indexOf('-') < 0) {   // 학년 전체: 그 학년의 반·개별 선택은 지워요
          const on = !sel[k];
          Object.keys(sel).forEach(function (x) { if (x[0] === g) delete sel[x]; });
          if (on) sel[k] = true;
        } else {                    // 반 전체: 그 반의 개별 선택은 지워요
          delete sel[g];
          const on = !sel[k];
          (grades[g][k.split('-')[1]] || []).forEach(function (x) { delete sel[x.studentId]; });
          if (on) sel[k] = true; else delete sel[k];
        }
        changed();
      };
    });
    el.querySelectorAll('[data-s]').forEach(function (b) {
      b.onclick = function () {
        const sid = b.getAttribute('data-s');
        if (sel[sid]) delete sel[sid]; else sel[sid] = true;   // 누른 학생만 넣고 빼요
        changed();
      };
    });
    el.querySelectorAll('[data-pg]').forEach(function (b) { b.onclick = function () { pickG = b.getAttribute('data-pg'); pickC = Object.keys(grades[pickG]).sort(function (a, b) { return a - b; })[0]; paint(); }; });
    el.querySelectorAll('[data-pc]').forEach(function (b) { b.onclick = function () { pickC = b.getAttribute('data-pc'); paint(); }; });
  }
  function wireSeg() { el.querySelectorAll('[data-mode]').forEach(function (b) { b.onclick = function () { if (b.getAttribute('data-mode') !== mode) setMode(b.getAttribute('data-mode')); }; }); }
  function changed() { paint(); if (onChange) onChange(targets(), count()); }
  el._targets = targets;
  el._count = count;
  paint();
}

    const el = document.getElementById('tabTargets'); const m = /^\s*([1-9])\s*학년/.exec(this.value);
    if (m && el && el._targets && !el._targets().length) mountTargetPicker_('tabTargets', [m[1]]);
  });
  document.getElementById('createBtn').onclick = doCreateTab;
}

async function doCreateTab() {
  const tabName = document.getElementById('tabName').value.trim();
  if (!tabName) return renderNewTab('과제 이름을 입력해주세요.');
  const fields = Array.prototype.slice.call(document.querySelectorAll('#fieldRows .fieldrow')).map(function (row) {
    const name = row.querySelector('.fname').value.trim();
    const type = row.querySelector('.ftype').value;
    if (!name) return null;
    return type === 'long' ? name + '::long' : type === 'file' ? name + '::file' : name;
  }).filter(Boolean);
  if (!fields.length) return renderNewTab('항목을 하나 이상 입력해주세요.');

  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = '만드는 중…';
  let res;
  try { res = await api('addTab', { tabName: tabName, fields: fields }); }
  catch (e) { return; }
  if (!res.success) return renderNewTab(res.message || '만들기에 실패했습니다.');

  // 고른 설정을 바로 적용해요(하나가 실패해도 과제는 만들어진 상태라 과제 화면에서 다시 바꿀 수 있어요).
  const modeEl = document.querySelector('.modepick input[name=mode]:checked');
  const qr = modeEl && modeEl.value === 'qr';
  const desc = (document.getElementById('tabDesc').value || '').trim();
  const dl = (document.getElementById('tabDeadline').value || '').slice(0, 16);
  const ap = document.getElementById('tabAp').checked;
  const tgEl = document.getElementById('tabTargets');
  const targets = (tgEl && tgEl._targets) ? tgEl._targets() : [];
  const openAt = (document.getElementById('tabOpenAt').value || '').slice(0, 16);
  const apMin = Number(document.getElementById('tabApMin').value) || 20;
  const fails = [];
  async function step(label, action, data) {
    btn.textContent = label + ' 적용 중…';
    try { const r = await api(action, data); if (!r || r.success !== true) fails.push(label + ': ' + ((r && r.message) || '실패')); }
    catch (e) { if (String(e && e.message) === 'unauthorized') throw e; fails.push(label + ': 서버 연결 실패'); }
  }
  if (targets.length) await step('대상', 'setTargets', { tabName: tabName, targets: targets });
  if (targets.length && !qr) await step('명단 만들기', 'autoRoster', { tabName: tabName, apply: true, targets: targets });
  if (openAt) await step('예약 공개', 'setSchedule', { tabName: tabName, openAt: openAt });
  if (desc) await step('교사 안내', 'updateHeaders', { tabName: tabName, headers: ['학번', '이름'].concat(fields), description: desc });
  if (qr) await step('로그인 없이 받기', 'setOpenAccess', { tabName: tabName, on: true });
  if (dl) await step('제출 기한', 'setDeadline', { tabName: tabName, deadline: dl });
  if (ap) await step('복붙 방지', 'setAntiPaste', { tabName: tabName, on: true, minChars: apMin });
  if (fails.length) alert('과제는 만들었지만 일부 설정을 적용하지 못했어요. 과제 화면에서 다시 바꿔 주세요.\n\n' + fails.join('\n'));
  renderDetail(tabName);
}

// ---------- 과제 상세 ----------

async function renderDetail(tabName) {
  state.nav = 'tasks';
  state.currentTab = tabName;
  render('<div class="wrap"><div class="loading">불러오는 중…</div></div>');
  let cfg;
  try { cfg = await apiGet('getConfig'); } catch (e) { return; }
  state.config = cfg;
  const tab = (cfg.tabs || []).find(function (t) { return t.sheetName === tabName; });
  if (!tab) return renderDashboard();

  const status = effStatus_(tab);

    try { r = await api('ensureShortCode', { tabName: tabName }); } catch (e) { scMake.disabled = false; return; }
    if (!r || r.success !== true) { scMake.disabled = false; scMake.textContent = '짧은 주소 · QR 만들기'; alert((r && r.message) || '만들지 못했어요. 서버(Code.gs)가 버전 32 이상인지 확인해주세요.'); return; }
    renderDetail(tabName);
  };
  const oaCopy = document.getElementById('oaCopy');
  if (oaCopy) oaCopy.onclick = async function () {
    const v = document.getElementById('oaUrl').value, btn = this;
    try { await navigator.clipboard.writeText(v); btn.textContent = '복사됨 ✓'; }
    catch (e) { window.prompt('아래 주소를 복사해 주세요', v); }
  };
  paintTargetSummary_(tabName, tab);
  const annOpen = document.getElementById('annOpen');
  if (annOpen) annOpen.onclick = function () { toggleAnnounce_(tabName, tab, openAcc); };
  wirePushTile_(tabName);
  document.getElementById('apToggle').onclick = async function () {
    const btn = this; btn.disabled = true;
    let r;
    try { r = await api('setAntiPaste', { tabName: tabName, on: !ap }); } catch (e) { btn.disabled = false; return; }
    if (!r || r.success !== true) { btn.disabled = false; alert((r && r.message) || '바꾸지 못했어요. 서버(Code.gs)가 버전 24 이상인지 확인해주세요.'); return; }
    renderDetail(tabName);
  };
  const apMinEl = document.getElementById('apMin');
  if (apMinEl) apMinEl.onchange = async function () {
    const msg = document.getElementById('apMsg');
    const v = Number(apMinEl.value);
    if (!(v >= 5 && v <= 500)) { msg.textContent = '5~500 사이로 입력해주세요.'; apMinEl.value = apMin; return; }
    msg.textContent = '저장 중…';
    let r;
    try { r = await api('setAntiPaste', { tabName: tabName, on: true, minChars: v }); } catch (e) { msg.textContent = ''; return; }
    msg.textContent = (r && r.success) ? ('저장했어요 (' + r.antiPasteMin + '자)') : ((r && r.message) || '저장하지 못했어요.');
  };
  document.getElementById('teacherFileInput').onchange = function (e) { doUploadTeacherFile(tabName, e.target.files[0]); };
  const clearBtn = document.getElementById('clearTeacherFileBtn');
  if (clearBtn) clearBtn.onclick = function () { doClearTeacherFile(tabName); };
  document.querySelectorAll('.tabs button').forEach(function (b) {
    if (b.getAttribute('data-view') === state.detailView) b.classList.add('active');
    b.onclick = function () { state.detailView = b.getAttribute('data-view'); renderDetail(tabName); };
  });

  if (state.detailView === 'roster') renderRoster(tab);
  else if (state.detailView === 'submissions') renderSubmissions(tab);
  else renderLog(tab);
}

      try { await api('setRosterConfirm', { tabName: tab.sheetName, studentId: b.getAttribute('data-confirm-on'), on: true }); } catch (e) { return; }
      renderRoster(tab);
    };
  });

async function doSaveRoster(tab) {
  const raw = document.getElementById('rosterRaw').value;
  const lines = raw.split('\n');
  const entries = [];
  lines.forEach(function (line) {
    const t = line.trim();
    if (!t) return;
    const cols = (t.indexOf('\t') >= 0 ? t.split('\t') : t.split(',')).map(function (c) { return c.trim(); });
    const id = cols[0] || '';
    const name = cols[1] || '';
    const code = (cols[2] || '').toUpperCase();
    if (!/^\d{4,10}$/.test(id) || !name) return;
    const entry = { studentId: id, name: name };
    if (/^[A-Z0-9]+$/.test(code)) entry.code = code;
    entries.push(entry);
  });
  const msg = document.getElementById('rosterMsg');
  if (!entries.length) { msg.innerHTML = '<div class="msg error">인식된 줄이 없습니다.</div>'; return; }

  const btn = document.getElementById('saveRosterBtn');
  btn.disabled = true; btn.textContent = '저장 중…';
  let res;
  try { res = await api('saveRoster', { tabName: tab.sheetName, entries: entries }); } catch (e) { return; }
  if (!res.success) { msg.innerHTML = '<div class="msg error">' + escapeHtml(res.message || '저장 실패') + '</div>'; btn.disabled = false; btn.textContent = '저장'; return; }
  renderRoster(tab);
}

function traceKey_(sid) {
  const t = String(sid == null ? '' : sid).trim();
  return /^\d+$/.test(t) ? String(Number(t)) : t;
}

// 작성 기록 칸 — 붙여넣기 시도가 있거나 한 번에 기준 글자 수 이상 들어온 적이 있으면 «의심»으로 표시합니다.
function traceCellHtml_(t, min) {
  if (!t) return '<td><span class="hint">기록 없음</span></td>';
  const big = t.maxChunk >= min, tries = t.pasteTries > 0, flag = big || tries;
  const parts = [];
  if (tries) parts.push('붙여넣기 시도 ' + t.pasteTries + '회');
  if (t.maxChunk) parts.push('한꺼번에 최대 ' + t.maxChunk + '자' + (t.chunks ? ' (' + min + '자 이상 ' + t.chunks + '회)' : ''));
  if (t.activeSec) parts.push('작성 ' + Math.max(1, Math.round(t.activeSec / 60)) + '분');
  if (t.chars) parts.push(t.chars + '자');
  if (t.note) parts.push(t.note);
  const pill = flag
    ? '<span class="pill" style="color:var(--error-text);background:var(--error-bg);">의심</span>'
    : '<span class="pill open">정상</span>';
  return '<td style="min-width:180px;">' + pill + '<div class="hint" style="margin-top:4px;line-height:1.5;">' + escapeHtml(parts.join(' · ')) + '</div></td>';
}

async function renderSubmissions(tab) {
  const body = document.getElementById('detailBody');
  body.innerHTML = '<div class="loading">불러오는 중…</div>';
  let res;
  try { res = await api('getSubmissions', { tabName: tab.sheetName }); } catch (e) { return; }
  if (!res.success) { body.innerHTML = '<div class="msg error">' + escapeHtml(res.message || '불러오기 실패') + '</div>'; return; }

  const fields = res.fields || [];
  const rows = res.rows || [];
  const reviewIdx = fields.findIndex(function (f) { return f.type === 'reviewStatus'; });
  const feedbackIdx = fields.findIndex(function (f) { return f.type === 'feedback'; });

  const traces = res.traces || {};
  const apOn = !!res.antiPaste, apMin = res.antiPasteMin || 20;
  const showTrace = apOn || Object.keys(traces).length > 0;
  let flagged = 0, traced = 0;
  rows.forEach(function (r) {
    const t = traces[traceKey_(r[0])];
    if (!t) return;
    traced++;
    if (t.pasteTries > 0 || t.maxChunk >= apMin) flagged++;
  });

  const head = '<tr>' + fields.map(function (f) { return '<th>' + escapeHtml(f.name) + '</th>'; }).join('') + (showTrace ? '<th>작성 기록</th>' : '') + '</tr>';

  const body_ = rows.map(function (r, ri) {
    const sid = r[0];
    return '<tr>' + r.map(function (v, ci) {
      if (ci === reviewIdx) {
        return '<td>' + reviewPill_(v) + '<br>' +
          '<button class="btn-outline btn-sm revOpen" data-row="' + ri + '" style="margin-top:6px;">검토·기록</button></td>';
      }
      if (ci === feedbackIdx) {
        return '<td style="min-width:160px;"><div class="fbtext" style="white-space:pre-wrap;font-size:12px;margin-bottom:6px;">' +
          (v ? escapeHtml(v) : '<span class="hint">없음</span>') + '</div>' +
          '<button class="btn-outline btn-sm fbEditBtn" data-row="' + ri + '">피드백 작성</button></td>';
      }
      return '<td>' + escapeHtml(v) + '</td>';
    }).join('') + (showTrace ? traceCellHtml_(traces[traceKey_(sid)], apMin) : '') + '</tr>';
  }).join('');

  const nameIdx = fields.findIndex(function (f) { return /이름|성명/.test(f.name); });
  const timeIdx = fields.findIndex(function (f) { return /시각|시간|제출일|일시/.test(f.name); });
  const cards = rows.map(function (r, ri) {
    const t = traces[traceKey_(r[0])];
    const flag = !!t && (t.pasteTries > 0 || t.maxChunk >= apMin);
    const rv = reviewIdx >= 0 ? String(r[reviewIdx] || '') : '';
    const done = rv === '검토완료';
    const nm = nameIdx >= 0 ? r[nameIdx] : '';
    const sub = [timeIdx >= 0 ? r[timeIdx] : '', flag && t.maxChunk ? '한 번에 ' + t.maxChunk + '자' : ''].filter(Boolean).join(' · ');
    return '<div class="srow" data-ri="' + ri + '" style="cursor:pointer;" data-flag="' + (flag ? 1 : 0) + '" data-done="' + (done ? 1 : 0) + '"><div class="dot">' + escapeHtml(String(nm || r[0] || '?').slice(-2)) + '</div>' +
      '<div class="t">' + escapeHtml(nm ? r[0] + ' ' + nm : r[0]) + '<small>' + escapeHtml(sub) + '</small></div>' +
      '<span class="tag ' + (rv === '반려' ? 'no' : flag ? 'wr' : 'ok') + '">' + (rv === '반려' ? '반려' : flag ? '복붙 의심' : done ? '검토완료' : '제출') + '</span></div>';
  }).join('');
  const mobileList =
    '<div class="subm"><div class="kpis" style="grid-template-columns:1fr 1fr 1fr;"><div class="kpi"><span>제출</span><b>' + rows.length + '</b></div>' +
    '<div class="kpi"><span>복붙 의심</span><b style="color:#8a6500;">' + flagged + '</b></div>' +
    '<div class="kpi"><span>검토완료</span><b>' + rows.filter(function (r) { return reviewIdx >= 0 && r[reviewIdx] === '검토완료'; }).length + '</b></div></div>' +
    '<div class="chips" id="subChips"><button class="on" data-f="all">전체</button><button data-f="flag">복붙 의심</button><button data-f="todo">검토 전</button></div>' +
    '<div id="subCards">' + (cards || '<p class="hint">제출된 답변이 없습니다.</p>') + '</div>' +
    '<p class="hint" style="margin:8px 2px 16px;">학생을 누르면 검토 완료·반려·피드백과 제출 기록을 볼 수 있어요.</p></div>';

  body.innerHTML = mobileList +
    '<p class="hint">총 ' + rows.length + '건' +
      (apOn ? ' · 복붙 방지 켜짐 · 한 번에 ' + apMin + '자 이상 기록 · 의심 ' + flagged + '명 / 기록 ' + traced + '명' : (showTrace ? ' · 복붙 방지 꺼짐 (이전 작성 기록이 있어요)' : '')) +
      (apOn && res.antiPastePartial ? ' · 수업 도중에 켜서 그 전에 쓴 글은 기록이 없을 수 있어요' : '') + '</p>' +
    (reviewIdx < 0 ? '<p class="hint">검토상태·피드백 열은 학생이 한 번 이상 제출하면 자동으로 생깁니다.</p>' : '') +
    '<div class="tablewrap"><table>' + head + (body_ || '<tr><td class="hint">제출된 답변이 없습니다.</td></tr>') + '</table></div>' +
    '<button class="btn-outline" id="csvBtn">CSV 내보내기</button>';

  document.getElementById('csvBtn').onclick = function () { exportCsv(tab.sheetName, fields, rows); };
  document.querySelectorAll('#subChips button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('#subChips button').forEach(function (x) { x.classList.toggle('on', x === b); });
      const f = b.getAttribute('data-f');
      document.querySelectorAll('#subCards .srow').forEach(function (r) {
        r.style.display = (f === 'all' || (f === 'flag' && r.dataset.flag === '1') || (f === 'todo' && r.dataset.done !== '1')) ? '' : 'none';
      });
    };
  });

  function openRev_(ri) {
    const r = rows[ri];
    openReviewSheet_(tab.sheetName, r[0], nameIdx >= 0 ? r[nameIdx] : '', reviewIdx >= 0 ? r[reviewIdx] : '', feedbackIdx >= 0 ? r[feedbackIdx] : '', function () { renderSubmissions(tab); });
  }
  document.querySelectorAll('.revOpen').forEach(function (b) { b.onclick = function () { openRev_(Number(b.getAttribute('data-row'))); }; });
  document.querySelectorAll('#subCards .srow').forEach(function (el) { el.onclick = function () { openRev_(Number(el.getAttribute('data-ri'))); }; });
  document.querySelectorAll('.reviewToggle').forEach(function (btn) {
    btn.onclick = async function () {
      const ri = Number(btn.getAttribute('data-row'));
      const sid = rows[ri][0];
      const next = btn.getAttribute('data-next');
      const curFeedback = feedbackIdx >= 0 ? (rows[ri][feedbackIdx] || '') : '';
      btn.disabled = true;
      let res2;
      try { res2 = await api('setReview', { tabName: tab.sheetName, studentId: sid, reviewStatus: next, feedback: curFeedback }); }
      catch (e) { btn.disabled = false; return; }
      if (res2.success) renderSubmissions(tab);
      else { alert(res2.message || '저장 실패'); btn.disabled = false; }
    };
  });

  document.querySelectorAll('.fbEditBtn').forEach(function (btn) {
    btn.onclick = function () {
      const ri = Number(btn.getAttribute('data-row'));
      const cur = feedbackIdx >= 0 ? (rows[ri][feedbackIdx] || '') : '';
      const cell = btn.closest('td');
      cell.innerHTML =
        '<textarea class="fbInput" style="width:100%;box-sizing:border-box;min-height:64px;font-size:12px;font-family:inherit;padding:6px;border:1px solid var(--border);border-radius:6px;">' + escapeHtml(cur) + '</textarea>' +
        '<button class="btn btn-sm fbSaveBtn" style="margin-top:6px;">저장</button>';
      cell.querySelector('.fbSaveBtn').onclick = async function () {
        const sid = rows[ri][0];
        const text = cell.querySelector('.fbInput').value;
        const curStatus = (reviewIdx >= 0 && rows[ri][reviewIdx]) || '검토중';
        let res2;
        try { res2 = await api('setReview', { tabName: tab.sheetName, studentId: sid, reviewStatus: curStatus, feedback: text }); }
        catch (e) { return; }
        if (res2.success) renderSubmissions(tab);
        else alert(res2.message || '저장 실패');
      };
    };
  });
}

function exportCsv(name, fields, rows) {
  function q(v) { v = String(v == null ? '' : v); return '"' + v.replace(/"/g, '""') + '"'; }
  let csv = fields.map(function (f) { return q(f.name); }).join(',') + '\n';
  rows.forEach(function (r) { csv += r.map(q).join(',') + '\n'; });
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '_제출현황.csv';
  a.click();
}

  );

// ---------- 홈 대시보드 (모바일 시안: 요약 카드 · 마감 임박 과제 · 과제별 제출 진행) ----------
function ringSvg_(pct, label) {
  const c = 2 * Math.PI * 34, d = Math.max(0, Math.min(1, pct)) * c;
  return '<svg class="ring" width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="34" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10"/>' +
    '<circle cx="43" cy="43" r="34" fill="none" stroke="#2FBF8A" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + d.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 43 43)"/>' +
    '<text x="43" y="48" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">' + escapeHtml(label) + '</text></svg>';
}
async function loadHomeDash_(st) {
  const box = document.getElementById('homeDash');
  if (!box) return;
  const d = new Date();
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const tp = (st && st.teacher) || {};
  const head = '<div class="hello"><div class="av">' + escapeHtml((tp.subject || tp.name || '체').charAt(0)) + '</div><h1>안녕하세요, ' + (tp.name ? escapeHtml(tp.name) + ' ' : '') + '선생님' + (tp.subject ? ' <span class="hint" style="font-weight:600;">· ' + escapeHtml(tp.subject) + '</span>' : '') + '<small>' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일</small></h1></div>';
  box.innerHTML = head + '<div class="hint" style="margin-bottom:12px;">과제 현황을 불러오는 중…</div>';
  let cfg;
  try { cfg = state.config || await apiGet('getConfig'); state.config = cfg; } catch (e) { box.innerHTML = head; return; }
  const tabs = (cfg.tabs || []);
  const open = tabs.filter(function (t) { return (effStatus_(t)) === 'open'; });
  const stats = [];
  for (const t of open.slice(0, 6)) {
    let total = 0, done = 0, flagged = 0;
    try {
      const r1 = await api('getRoster', { tabName: t.sheetName }); total = (r1.entries || []).length;
      const r2 = await api('getSubmissions', { tabName: t.sheetName }); done = (r2.rows || []).length;
      const tr = r2.traces || {}, min = r2.antiPasteMin || 20;
      Object.keys(tr).forEach(function (k) { if (tr[k].pasteTries > 0 || tr[k].maxChunk >= min) flagged++; });
    } catch (e) {}
    stats.push({ name: t.sheetName, total: total, done: done, flagged: flagged });
  }
  if (!document.getElementById('homeDash')) return;
  const missing = stats.reduce(function (a, x) { return a + Math.max(0, x.total - x.done); }, 0);
  const flaggedAll = stats.reduce(function (a, x) { return a + x.flagged; }, 0);
  const lead = stats.slice().sort(function (a, b) { return (b.total - b.done) - (a.total - a.done); })[0];
  const pct = function (x) { return x.total ? x.done / x.total : 0; };
  const go = function (n) { return 'data-go="' + escapeHtml(n) + '"'; };
  box.innerHTML = head +
    '<div class="kpis"><div class="kpi"><span>진행 중 과제</span><b>' + open.length + '</b><em class="up">전체 ' + tabs.length + '개</em></div>' +
    '<div class="kpi"><span>미제출 학생(합계)</span><b>' + missing + '</b>' + (flaggedAll ? '<em class="dn">복붙 의심 ' + flaggedAll + '</em>' : '<em class="up">의심 0</em>') + '</div></div>' +
    (lead ? '<div class="focus" ' + go(lead.name) + '>' + ringSvg_(lead.total ? pct(lead) : (lead.done ? 1 : 0), lead.total ? Math.round(pct(lead) * 100) + '%' : lead.done + '건') +
      '<div><h3>' + escapeHtml(lead.name) + '</h3><p>' + (lead.total
        ? '제출 ' + lead.done + ' / ' + lead.total + '명<br>미제출 ' + (lead.total - lead.done) + '명 · 알림 켠 기기 ' + st.tokenCount + '대'
        : '제출 ' + lead.done + '건<br>명단 없는 과제(QR) · 누가 안 냈는지는 셀 수 없어요') + '</p></div></div>' : '') +
    '<div class="hnav">진행 중 과제<span>눌러서 상세 보기</span></div>' +
    (stats.map(function (x) {
      const p = Math.round(pct(x) * 100);
      return '<div class="tcard" ' + go(x.name) + '><div class="top"><span class="item-name">' + taskIconHtml_(x.name, 24) + escapeHtml(x.name) + '</span>' +
        (x.total ? '<span class="tag ' + (p >= 80 ? 'ok' : p >= 40 ? 'wr' : 'no') + '">' + p + '%</span>' : '<span class="tag ok">' + x.done + '건</span>') + '</div>' +
        '<div class="pbar"><i style="width:' + (x.total ? p : (x.done ? 100 : 0)) + '%"></i></div><div class="sub"><span>' + (x.total ? '제출 ' + x.done + ' / ' + x.total : '제출 ' + x.done + '건 · 명단 없는 과제(QR)') + '</span><span>' + (x.flagged ? '복붙 의심 ' + x.flagged + '명' : '') + '</span></div></div>';
    }).join('') || '<p class="hint">진행 중인 과제가 없어요.</p>');
  box.querySelectorAll('[data-go]').forEach(function (el) { el.onclick = function () { renderDetail(el.getAttribute('data-go')); }; });
}

const rosterState = { parsed: [], skipped: [] };
const srcState = { students: [], title: '', codes: {}, tabs: [] };

function gradeOfTab_(name) { const m = String(name).match(/^\s*([123])\s*학년/); return m ? Number(m[1]) : 0; }
function targetsFor_(tabName) {
  const g = gradeOfTab_(tabName);
  return srcState.students.filter(function (s) { return !g || s.grade === g; });
}

function gradeCounts_(list) {
  const c = { 1: 0, 2: 0, 3: 0 };
  (list || []).forEach(function (x) { if (c[x.grade] != null) c[x.grade]++; });
  return c;
}
function fmtNowKst_() {
  const p = {};
  new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
  return p.year + '.' + p.month + '.' + p.day + ' ' + p.hour + ':' + p.minute + ':' + p.second;
}
// 학생명단 시트를 다시 읽어요. 이전에 읽은 인원과 비교해서 바뀐 학년을 알려줘요.
async function refreshRosterSource_() {
  const before = gradeCounts_(srcState.students);
  const had = (srcState.students || []).length > 0;
  await renderRosterImport(null, { before: before, had: had });
}

async function renderRosterImport(notice, refresh) {
  state.nav = 'roster';

  try { cfg = await apiGet('getConfig'); state.config = cfg; } catch (e) {}
  let exc = [];
  try { const er = await api('getRosterExceptions'); if (er && er.success) exc = er.exceptions || []; } catch (e) {}
  srcState.tabs = (cfg && cfg.tabs) || [];
  srcState.readAt = fmtNowKst_();
  try { localStorage.setItem('hyewon_roster_read_at', srcState.readAt); } catch (e) {}

      '<p class="lead" style="margin-top:10px;">학번 / 이름 / 학생코드를 탭이나 쉼표로 구분해 붙여넣으세요. «전출»·«유학» 같은 상태 표시는 자동으로 걸러져요.</p>' +

    '</details>';

    render(

function parseCodes_() {
  const map = {}, bad = [];
  document.getElementById('codeRaw').value.split('\n').forEach(function (line) {
    const t = line.trim();
    if (!t) return;
    const toks = t.split(/[\t, ]+/).filter(Boolean);
    const id = toks.find(function (x) { return /^\d{4}$/.test(x); });
    const code = toks.slice().reverse().find(function (x) { return /^[A-Za-z0-9]{4,}$/.test(x) && !/^\d{4}$/.test(x); });
    if (!id || !code) { bad.push(t); return; }
    map[id] = code.toUpperCase();
  });
  srcState.codes = map;
  return { map: map, bad: bad };
}

function checkCodes() {
  const r = parseCodes_();
  const ids = {}; srcState.students.forEach(function (s) { ids[s.studentId] = 1; });
  const linked = srcState.students.filter(function (s) { return r.map[s.studentId]; }).length;
  const onlyCode = Object.keys(r.map).filter(function (k) { return !ids[k]; });
  const fresh = srcState.students.length - linked;
  document.getElementById('codeSummary').innerHTML =
    '<div class="msg ok" style="margin:0 0 8px;">기존 코드 연결 <b>' + linked + '명</b> · 코드 없음(서버에 있으면 유지, 없으면 새 발급) <b>' + fresh + '명</b></div>' +
    (onlyCode.length ? '<div class="msg warn" style="margin:0 0 8px;">코드표에만 있고 명렬표에는 없는 학번 ' + onlyCode.length + '개: ' + escapeHtml(onlyCode.slice(0, 15).join(', ')) + (onlyCode.length > 15 ? ' …' : '') + '</div>' : '') +
    (r.bad.length ? '<div class="msg warn" style="margin:0;">읽지 못한 줄 ' + r.bad.length + '개</div>' : '');
}

async function applyRoster() {
  const picks = Array.prototype.slice.call(document.querySelectorAll('.rsPick:checked')).map(function (c) { return srcState.tabs[Number(c.getAttribute('data-i'))].sheetName; });
  if (!picks.length) { alert('적용할 과제를 하나 이상 골라주세요.'); return; }
  parseCodes_();

  const removedInfo = [];
  for (const tab of picks) {
    let cur;
    try { cur = await api('getRoster', { tabName: tab }); } catch (e) { return; }
    const keep = {}; targetsFor_(tab).forEach(function (s) { keep[s.studentId] = 1; });
    const removed = ((cur && cur.entries) || []).filter(function (e) { return !keep[e.studentId]; });
    if (removed.length) removedInfo.push(tab + ': 명렬표에 없어서 빠지는 학생 ' + removed.length + '명');
  }
  const summary = picks.map(function (t) { return t + ' (' + targetsFor_(t).length + '명)'; }).join('\n');
  if (!confirm('아래 과제의 명단을 시트 기준으로 바꿀까요?\n\n' + summary + (removedInfo.length ? '\n\n※ ' + removedInfo.join('\n※ ') : ''))) return;

  const btn = document.getElementById('rsApply');
  btn.disabled = true; btn.textContent = '가져오는 중…';
  const done = [];
  for (const tab of picks) {
    const entries = targetsFor_(tab).map(function (s) { return { studentId: s.studentId, name: s.name, code: srcState.codes[s.studentId] || '' }; });
    let r;
    try { r = await api('saveRoster', { tabName: tab, entries: entries }); } catch (e) { return; }
    if (!r || !r.success) return renderRosterImport({ type: 'error', text: tab + ': ' + ((r && r.message) || '저장에 실패했어요.') });
    done.push(tab + ' ' + entries.length + '명');
  }
  renderRosterImport({ type: 'ok', text: '가져왔어요 — ' + done.join(' · ') });
}

function doRosterParse() {
  const tabName = document.getElementById('rsTab').value.trim();
  const raw = document.getElementById('rsRaw').value;
  const parsed = [], skipped = [];
  raw.split('\n').forEach(function (line) {
    const t = line.trim();
    if (!t) return;
    const cols = (t.indexOf('\t') >= 0 ? t.split('\t') : t.split(',')).map(function (c) { return c.trim(); });
    const id = cols[0] || '', name = cols[1] || '', code = (cols[2] || '').toUpperCase();
    if (!/^\d{4,10}$/.test(id)) { if (id && id !== '학번') skipped.push(t + '  (학번 형식 아님)'); return; }
    if (!name) { skipped.push(t + '  (이름 없음)'); return; }
    if (!/^[A-Z0-9]+$/.test(code)) { skipped.push(id + ' ' + name + '  (코드 없음/상태표시: ' + (cols[2] || '') + ')'); return; }
    parsed.push({ studentId: id, name: name, code: code });
  });
  rosterState.parsed = parsed; rosterState.skipped = skipped;
  const rows = parsed.map(function (e) { return '<tr><td>' + escapeHtml(e.studentId) + '</td><td>' + escapeHtml(e.name) + '</td><td><span class="code">' + escapeHtml(e.code) + '</span></td></tr>'; }).join('');
  document.getElementById('rsPreview').innerHTML =
    '<div class="card wide">' +
      '<div class="msg ' + (parsed.length ? 'ok' : 'warn') + '">' + parsed.length + '명 인식됨' + (tabName ? ' · 과제: ' + escapeHtml(tabName) : ' · 과제 이름을 입력해주세요') + '</div>' +
      (skipped.length ? '<p class="hint">제외됨 (' + skipped.length + '건): ' + skipped.map(escapeHtml).join(' · ') + '</p>' : '') +
      '<div class="tablewrap"><table><tr><th>학번</th><th>이름</th><th>학생코드</th></tr>' + rows + '</table></div>' +
      '<button class="btn" id="rsSave"' + (parsed.length && tabName ? '' : ' disabled') + '>이 ' + parsed.length + '명 명단에 저장</button>' +
    '</div>';
  const b = document.getElementById('rsSave');
  if (b) b.onclick = function () { doRosterSave(tabName); };
}

// 그림 파일 → 가운데를 정사각형으로 잘라 128px WebP(안 되면 PNG)로 줄여요.
function shrinkIcon_(file) {
  return new Promise(function (res, rej) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      const S = 128, c = document.createElement('canvas'); c.width = S; c.height = S;
      const g = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let d = c.toDataURL('image/webp', 0.86);
      if (!/^data:image\/webp/.test(d)) d = c.toDataURL('image/png');
      res(d);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('그림을 읽지 못했어요')); };
    img.src = url;
  });
}

function tipHtml_(text) {
  return '<span class="tip" tabindex="0" role="button" aria-label="설명 보기" onmouseenter="tipPlace_(this)" onclick="tipToggle_(event,this)">ⓘ<span class="tip-box">' + escapeHtml(text) + '</span></span>';
}
function tipToggle_(e, el) {
  e.preventDefault(); e.stopPropagation();
  const open = !el.classList.contains('open');
  document.querySelectorAll('.tip.open').forEach(function (t) { t.classList.remove('open'); });
  if (open) { el.classList.add('open'); tipPlace_(el); }
}
// 화면 밖으로 나가지 않게 아이콘 아래(자리가 없으면 위)에 놓아요.
function tipPlace_(el) {
  const box = el.querySelector('.tip-box'); if (!box) return;
  const r = el.getBoundingClientRect();
  const w = Math.min(300, window.innerWidth - 16);
  box.style.width = w + 'px';
  box.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  box.style.visibility = 'hidden'; box.style.display = 'block';
  const h = box.offsetHeight;
  box.style.display = ''; box.style.visibility = '';
  box.style.top = (r.bottom + 8 + h > window.innerHeight - 8 ? Math.max(8, r.top - 8 - h) : r.bottom + 8) + 'px';
}

      '<div class="card">' +
        '<h2>성적 조회 연결</h2>' +
        '<p class="hint" style="margin:0 0 10px;">학생 화면의 «성적» 탭이 읽는 점수 시트예요. 연결이 잘 됐는지 확인해보세요.</p>' +
        '<button class="btn-outline" id="scChk" style="width:auto;">연결 확인</button>' +
        '<div id="scOut" style="margin-top:12px;font-size:13px;line-height:1.8;"></div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Firestore 연결</h2>' +
        '<p class="hint" style="margin:0 0 10px;">파이어베이스 데이터베이스(hyewon-portal)에 서버가 읽고 쓸 수 있는지 확인해요. 시험 문서 하나만 쓰고 다른 데이터는 건드리지 않아요.</p>' +
        '<button class="btn-outline" id="fsChk" style="width:auto;">연결 시험</button>' +
        '<div id="fsOut" style="margin-top:12px;font-size:13px;line-height:1.8;"></div>' +
      '</div>' +
      '<div class="card wide" style="margin-bottom:16px;">' +
        '<h2>교사 정보</h2>' +
        '<p class="hint" style="margin:0 0 10px;">학생 화면의 과제 상세에 «출제: ○○○ 선생님 · 과목»으로 보이고, 홈 인사말에도 쓰여요.</p>' +
        '<div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end;">' +
          '<div class="field" style="flex:1;min-width:160px;margin:0;"><label for="tpName">이름</label><input id="tpName" type="text" maxlength="20" placeholder="예: 김진호" value="' + escapeHtml((st.teacher && st.teacher.name) || '') + '"></div>' +
          '<div class="field" style="flex:1;min-width:140px;margin:0;"><label for="tpSubj">과목</label><input id="tpSubj" type="text" maxlength="20" placeholder="예: 체육" value="' + escapeHtml((st.teacher && st.teacher.subject) || '') + '"></div>' +
          '<button class="btn" id="tpSave" type="button">저장</button></div>' +
        '<p class="hint" id="tpMsg" style="margin:8px 0 0;"></p>' +
      '</div>' +
      '<div class="card wide" style="margin-bottom:16px;">' +
        '<h2>😀 과제 이모지</h2>' +
        '<p class="hint" style="margin:0 0 10px;">자주 쓰는 그림을 미리 올려 두면, 과제 화면에서 제목 왼쪽 아이콘을 눌러 골라요. 기본 이모지(🏀📝…)도 쓸 수 있어요.</p>' +
        '<div id="icBox"><span class="hint">불러오는 중…</span></div>' +
      '</div>' +
      '<div class="card wide" style="margin-bottom:16px;">' +
        '<h2>📱 선생님 알림 <span class="hint" style="font-weight:500;font-size:13px;">학생이 제출하면 이 폰으로</span></h2>' +
        '<p class="hint" style="margin:0 0 10px;">관리자 앱을 폰에 설치하고 «이 기기에서 알림 받기»를 누르세요. 받을 항목은 아래에서 골라요. ⓘ를 누르면 자세한 설명이 나와요.</p>' +
        '<div id="tpushBox"><span class="hint">불러오는 중…</span></div>' +
      '</div>' +
      '<div class="card wide" style="margin-bottom:16px;">' +
        '<h2>🔔 학생 자동 알림</h2>' +
        '<p class="hint" style="margin:0 0 10px;">학생이 혜원포털 앱에서 «알림 받기»를 켜 두면, 앱을 닫아도 휴대폰에 알림이 떠요. 밤 10시~아침 7시에는 보내지 않고 아침으로 미뤄요.</p>' +
        '<div id="apBox"><span class="hint">불러오는 중…</span></div>' +
      '</div>' +
      '<div class="card wide" style="margin-bottom:16px;">' +
        '<h2>제출 파일 저장 위치</h2>' +
        '<p class="hint" style="margin:0 0 10px;">학생이 올린 파일이 쌓이는 내 구글 드라이브 폴더예요. 미리 정해 두면 그 폴더에 쌓여요.</p>' +
        '<div id="upBox"><span class="hint">불러오는 중…</span></div>' +
      '</div>' +
      '<div class="card wide" style="margin-bottom:16px;">' +
        '<h2>카톡·밴드 썸네일 (GitHub 연결) ' + (st.githubReady ? '<span class="pill open">연결됨</span>' : '<span class="pill wait">연결 안 됨</span>') + '</h2>' +
        '<p class="hint" style="margin:0 0 10px;">과제 짧은 주소를 카톡·밴드에 보내면 과제명이 적힌 썸네일이 뜨게 해요. 서버가 혜원포털 저장소에 과제마다 작은 페이지를 써야 해서 GitHub 토큰이 필요해요.</p>' +
        (st.githubReady ? '' :
          '<ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.9;">' +
            '<li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 새 토큰 만들기(Fine-grained)</a>를 열어요.</li>' +
            '<li>Token name «혜원포털 썸네일», Expiration 1년, Repository access → <b>Only select repositories</b> → <b>hyewon-portal</b></li>' +
            '<li>Permissions → Repository permissions → <b>Contents: Read and write</b> (나머지는 그대로) → Generate token</li>' +
            '<li>나온 토큰(github_pat_…)을 복사해서 Apps Script 편집기 → 프로젝트 설정 → 스크립트 속성 → <b>GITHUB_TOKEN</b> 으로 넣어요. <span class="hint">채팅이나 다른 곳에는 붙이지 마세요.</span></li>' +
          '</ol>') +
      '</div>' +
      '<div class="card">' +
        '<h2>관리자 비밀번호 변경</h2>' +
        '<div class="field"><label for="curPw">현재 비밀번호</label><input id="curPw" type="password"></div>' +
        '<div class="field"><label for="newPw">새 비밀번호 (10자 이상)</label><input id="newPw" type="password"></div>' +
        '<button class="btn" id="changePwBtn">변경</button>' +
      '</div>' +
      '<div class="card"><h2>버전</h2><p class="hint" id="verLine" style="margin:0;"></p></div>' +
    '</div>'
  );
  document.getElementById('changePwBtn').onclick = doChangePassword;
  paintVer_();
  loadUploadBox_();
  loadAutoPushBox_();
  loadTeacherPushBox_();
  loadIconBox_();
  document.getElementById('tpSave').onclick = async function () {
    const msg = document.getElementById('tpMsg'); msg.textContent = '저장 중…';
    let r;
    try { r = await api('setTeacherProfile', { name: document.getElementById('tpName').value, subject: document.getElementById('tpSubj').value }); } catch (e) { msg.textContent = '서버에 연결하지 못했어요.'; return; }
    if (!r || r.success !== true) { msg.textContent = (r && r.message) || '저장하지 못했어요. 서버(Code.gs)가 버전 39 이상인지 확인해주세요.'; return; }
    msg.textContent = '저장했어요. 학생 화면에 «출제: ' + (r.teacher.name || '') + ' 선생님' + (r.teacher.subject ? ' · ' + r.teacher.subject : '') + '»로 보여요.';
  };
  document.getElementById('fsChk').onclick = async function () {
    const out = document.getElementById('fsOut');
    out.innerHTML = '<span class="hint">시험 중…</span>';
    let r;
    try { r = await api('testFirestore'); } catch (e) { out.innerHTML = '<div class="msg error">서버에 연결하지 못했어요.</div>'; return; }
    if (!r || r.success !== true) {
      out.innerHTML = '<div class="msg error">' + escapeHtml((r && r.message) || '시험하지 못했어요. 서버(Code.gs)가 버전 18 이상인지 확인해주세요.') + '</div>';
      return;
    }
    out.innerHTML =
      '<div class="msg ok" style="margin-bottom:10px;">연결됐어요</div>' +
      '<div>프로젝트: <b>' + escapeHtml(r.projectId || '') + '</b></div>' +
      '<div>쓰기 <b>' + r.writeMs + '</b>ms · 읽기 <b>' + r.readMs + '</b>ms</div>';
  };
  document.getElementById('scChk').onclick = async function () {
    const out = document.getElementById('scOut');
    out.innerHTML = '<span class="hint">확인 중…</span>';
    let r;
    try { r = await api('getScoreStatus'); } catch (e) { out.innerHTML = '<div class="msg error">서버에 연결하지 못했어요.</div>'; return; }
    if (!r || r.success === false || r.error) {
      out.innerHTML = '<div class="msg error">' + escapeHtml((r && r.message) || '확인하지 못했어요. 서버(Code.gs)를 최신으로 올렸는지 확인해주세요.') + '</div>';
      return;
    }
    const cats = (r.categories || []).map(function (c) { return escapeHtml(c.category) + ' <span class="hint">(' + c.count + '칸)</span>'; }).join(' · ');
    const crit = (r.criteria || []).map(function (c) { return escapeHtml(c.grade) + ' ' + escapeHtml(c.desc); }).join(' / ');
    out.innerHTML =
      '<div class="msg ' + (r.students ? 'ok' : 'error') + '" style="margin-bottom:10px;">' + (r.students ? '연결됐어요' : escapeHtml(r.message || '학생 줄을 찾지 못했어요')) + '</div>' +
      '<div>파일: <b>' + escapeHtml(r.fileTitle || '') + '</b> › 시트 <b>' + escapeHtml(r.sheetName) + '</b></div>' +
      '<div>학생 줄: <b>' + r.students + '</b>명 · 포털 명단과 겹침: <b>' + r.matched + '</b>명</div>' +
      '<div>종목: ' + (cats || '<span class="hint">찾지 못함</span>') + '</div>' +
      '<div>등급 기준: ' + (crit || '<span class="hint">«급간설정» 시트 없음</span>') + '</div>' +
      (r.firstId ? '<div class="hint">첫 학생 ' + escapeHtml(r.firstId) + ' · 총점 ' + escapeHtml(r.sampleScore || '-') + '</div>' : '');
  };
  document.getElementById('mcSave').onclick = async function () {
    const v = document.getElementById('mcIn').value.trim();
    if (!v) return;
    let r;
    try { r = await api('setMasterCode', { code: v }); } catch (e) { return; }
    renderSettings(r.success ? { type: 'ok', text: '마스터코드를 바꿨어요.' } : { type: 'error', text: r.message || '변경 실패' });
  };
  document.getElementById('copyStu').onclick = function () {
    const el = document.getElementById('stuUrl'); el.select();
    try { navigator.clipboard.writeText(el.value); } catch (e) { document.execCommand('copy'); }
    this.textContent = '복사됨';
  };
}

async function doChangePassword() {
  const cur = document.getElementById('curPw').value;
  const next = document.getElementById('newPw').value;
  if (!cur || !next) return;
  let res;
  try { res = await api('changePassword', { currentPassword: cur, newPassword: next }); } catch (e) { return; }
  if (!res.success) return renderSettings({ type: 'error', text: res.message || '변경 실패' });
  state.token = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  renderLogin('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
}

boot();
</script>
</body>
</html>
