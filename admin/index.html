<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>혜원포털 관리자</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  :root {
    --bg:#F6F5F1; --surface:#FFFFFF; --text:#1C1B1A; --text2:#6B6863; --text3:#A8A49A;
    --border:#E3E0D8; --accent:#087A55; --accent-dark:#065F44;
    --success-bg:#E7F6EC; --success-text:#1F7A3D;
    --error-bg:#FDEBEB; --error-text:#C22B2B;
    --warn-bg:#FFF4E0; --warn-text:#9A6400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; }
  .serif { font-family: 'Noto Serif KR', serif; }
  #app { min-height: 100vh; }
  .shell { display: flex; min-height: 100vh; }
  .side { width: 220px; flex-shrink: 0; background: #10342B; color: #A9C4B9; padding: 20px 12px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .side .brandbox { display: flex; align-items: center; gap: 10px; margin: 4px 6px 26px; }
  .side .brandbox img { width: 34px; height: 34px; border-radius: 10px; background: #fff; flex: none; }
  .side .brandbox b { color: #fff; font-size: 15px; line-height: 1.25; }
  .side .brandbox small { display: block; color: #7FA596; font-size: 11px; font-weight: 500; }
  .side button.nav, .side a.nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; color: #A9C4B9; font-family: inherit; font-size: 14px; font-weight: 600; padding: 11px 12px; border-radius: 10px; cursor: pointer; text-decoration: none; margin-bottom: 4px; }
  .side button.nav:hover, .side a.nav:hover { background: #1B4A3E; color: #fff; }
  .side button.nav.on { background: #087A55; color: #fff; }
  .side .spacer { flex: 1; }
  .side .divider { border-top: 1px solid #25483D; margin: 10px 6px; }
  .main { flex: 1; min-width: 0; }
  .main .wrap { max-width: 1000px; }
  .wrap { padding: 28px 28px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .stat span { display: block; font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 6px; }
  .stat b { font-size: 26px; }
  .stat b.small { font-size: 15px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .grid2 .card { max-width: none; margin-bottom: 0; }
  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .side { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; gap: 4px; overflow-x: auto; padding: 10px 10px; }
    .side .brandbox { margin: 0 8px 0 0; flex: none; }
    .side .brandbox b, .side .brandbox small { display: none; }
    .side button.nav, .side a.nav { width: auto; white-space: nowrap; flex: none; margin: 0; font-size: 13px; padding: 8px 12px; border-radius: 999px; }
    .side .spacer, .side .divider { display: none; }
    .wrap { padding: 20px 16px 60px; }
  }
  .center-pad { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 700; margin: 0 0 12px; }
  .lead { font-size: 13px; color: var(--text2); margin: 0 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px 20px; margin-bottom: 16px; max-width: 440px; }
  .card.wide { max-width: none; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  label { font-size: 13px; font-weight: 600; color: var(--text2); }
  input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 11px 13px; font-size: 14px; border: 1px solid var(--border); border-radius: 9px; background: #FCFCFB; font-family: inherit; color: var(--text); }
  textarea { min-height: 160px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(8,122,85,0.14); }
  .btn { display: inline-flex; align-items: center; gap: 6px; text-align: center; text-decoration: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 9px; border: none; cursor: pointer; font-family: inherit; }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-outline { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--text); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border); cursor: pointer; font-family: inherit; }
  .btn-danger { color: var(--error-text); border-color: rgba(194,43,43,.35); }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--text3); }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  .msg.error { background: var(--error-bg); color: var(--error-text); }
  .msg.ok { background: var(--success-bg); color: var(--success-text); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-text); }
  .list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .list a.item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: var(--text); font-weight: 600; font-size: 15px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .pill.open { color: var(--success-text); background: var(--success-bg); }
  .pill.wait, .pill.closed { color: var(--text2); background: #EFEDE7; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tabs button { background: none; border: none; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: #FAFAF8; color: var(--text2); font-weight: 700; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .tablewrap { overflow-x: auto; margin-bottom: 16px; }
  .code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; }
  .fieldrow { display: grid; grid-template-columns: 1fr 140px 34px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px; }
  .statusbtns { display: flex; gap: 6px; }
  .statusbtns button { flex: 1; }
  .ok-dot { color: var(--success-text); font-weight: 800; }
  .no-dot { color: var(--error-text); font-weight: 800; }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>

<script>
const TOKEN_KEY = 'hyewon_admin_token';
const state = { exec: '', token: '', config: null, currentTab: '', detailView: 'roster', nav: 'home' };

function qs(name) { return new URLSearchParams(location.search).get(name) || ''; }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () { resolve(String(reader.result).split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function fileSizeLabel(bytes) {
  bytes = Number(bytes) || 0;
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'KB';
  return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
}
function render(inner) {
  if (!state.token) { document.getElementById('app').innerHTML = inner; return; }
  const items = [
    ['home', '현황', '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'],
    ['tasks', '과제', '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'],
    ['roster', '명단', '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><path d="M17 5.5a3 3 0 0 1 0 5.5M18.5 14.2c2 .7 3 2.5 3 5.8"/>'],
    ['notice', '공지', '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'],
    ['settings', '설정', '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>']
  ];
  const nav = items.map(function (it) {
    return '<button class="nav' + (state.nav === it[0] ? ' on' : '') + '" data-nav="' + it[0] + '">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + it[2] + '</svg>' + it[1] + '</button>';
  }).join('');
  document.getElementById('app').innerHTML =
    '<div class="shell"><aside class="side">' +
      '<div class="brandbox"><img src="../assets/logo.png" alt=""><b>혜원포털<small>관리자</small></b></div>' +
      nav +
      '<div class="spacer"></div><div class="divider"></div>' +
      '<a class="nav" href="../report/" target="_blank" rel="noopener">학생 화면 보기</a>' +
      '<button class="nav" id="navLogout">로그아웃</button>' +
    '</aside><main class="main">' + inner + '</main></div>';
  document.querySelectorAll('[data-nav]').forEach(function (b) {
    b.onclick = function () {
      const k = b.getAttribute('data-nav');
      if (k === 'home') renderPortal(); else if (k === 'tasks') renderDashboard();
      else if (k === 'roster') renderRoster(); else if (k === 'notice') renderNotice(); else renderSettings();
    };
  });
  document.getElementById('navLogout').onclick = doLogout;
}

async function api(action, data, opts) {
  opts = opts || {};
  const body = new URLSearchParams();
  body.set('action', action);
  const payload = Object.assign({}, data || {});
  if (state.token && !opts.noToken) payload.token = state.token;
  body.set('data', JSON.stringify(payload));
  const res = await fetch(state.exec, { method: 'POST', body: body });
  const json = await res.json();
  if (json && json.error === 'unauthorized') {
    state.token = '';
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    renderLogin('세션이 끊어졌습니다. 다시 로그인해주세요.');
    throw new Error('unauthorized');
  }
  return json;
}
async function apiGet(action) {
  const url = new URL(state.exec);
  url.searchParams.set('action', action);
  const res = await fetch(url.toString());
  return res.json();
}

// ---------- 부팅 ----------

async function boot() {
  const override = qs('exec');
  if (override) {
    state.exec = override;
  } else {
    try {
      const routes = await (await fetch('../routes.json')).json();
      state.exec = routes.tools && routes.tools.report && routes.tools.report.exec;
    } catch (e) {}
  }
  if (!state.exec) {
    render('<div class="center-pad"><div class="card"><div class="msg error">연결 주소를 찾지 못했습니다. ?exec=... 로 직접 열어주세요.</div></div></div>');
    return;
  }
  try { state.token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  if (state.token) { renderPortal(); } else { renderLogin(); }
}

// ---------- 로그인 ----------

function renderLogin(errorMsg) {
  render(
    '<div class="center-pad"><div class="card">' +
      '<h1 class="serif">관리자 로그인</h1>' +
      (errorMsg ? '<div class="msg error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<div class="field"><label for="pw">비밀번호</label><input id="pw" type="password"></div>' +
      '<div class="field" style="flex-direction:row;align-items:center;gap:8px;">' +
        '<input type="checkbox" id="remember" style="width:auto;"><label for="remember" style="margin:0;">이 기기 기억하기 (30일)</label>' +
      '</div>' +
      '<button class="btn" id="loginBtn" style="width:100%;justify-content:center;">로그인</button>' +
    '</div></div>'
  );
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const pw = document.getElementById('pw').value;
  const remember = document.getElementById('remember').checked;
  if (!pw) return;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '확인 중…';
  let res;
  try { res = await api('login', { password: pw, remember: remember }, { noToken: true }); }
  catch (e) { return renderLogin('서버에 연결할 수 없습니다.'); }
  if (!res.success) { return renderLogin(res.message || '로그인에 실패했습니다.'); }
  state.token = res.token;
  if (remember) { try { localStorage.setItem(TOKEN_KEY, res.token); } catch (e) {} }
  renderPortal();
}

function doLogout() {
  api('logout', {}).catch(function () {});
  state.token = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  renderLogin();
}

// ---------- 대시보드(과제 목록) ----------

async function renderDashboard() {
  state.nav = 'tasks';
  render('<div class="wrap"><div class="loading">불러오는 중…</div></div>');
  let cfg;
  try { cfg = await apiGet('getConfig'); } catch (e) { return render('<div class="wrap"><div class="msg error">서버에 연결할 수 없습니다.</div></div>'); }
  state.config = cfg;

  const items = (cfg.tabs || []).map(function (t) {
    const s = (t.meta && t.meta.status) || 'open';
    const label = s === 'open' ? '진행중' : s === 'wait' ? '대기' : '마감';
    return '<a class="item" href="#" data-tab="' + escapeHtml(t.sheetName) + '"><span>' + escapeHtml(t.sheetName) + '</span><span class="pill ' + s + '">' + label + '</span></a>';
  }).join('');

  render(
    '<div class="wrap">' +
      '<h1 class="serif">과제 관리</h1>' +
      '<p class="lead">' + escapeHtml(cfg.title || '') + '</p>' +
      '<div class="list">' + (items || '<p class="hint">아직 과제가 없습니다.</p>') + '</div>' +
      '<button class="btn" id="newTabBtn">+ 새 과제 만들기</button>' +
    '</div>'
  );
  document.querySelectorAll('[data-tab]').forEach(function (a) {
    a.onclick = function (e) { e.preventDefault(); renderDetail(a.getAttribute('data-tab')); };
  });
  document.getElementById('newTabBtn').onclick = renderNewTab;
}

// ---------- 새 과제 만들기 ----------

function renderNewTab(notice) {
  state.nav = 'tasks';
  render(
    '<div class="wrap">' +
      '<h1 class="serif">새 과제 만들기</h1>' +
      (notice ? '<div class="msg error">' + escapeHtml(notice) + '</div>' : '') +
      '<div class="card wide">' +
        '<div class="field"><label for="tabName">과제 이름</label>' +
        '<input id="tabName" type="text" placeholder="예: 2학년-줄넘기 (학년 접두어를 붙이면 학년별 링크가 자동으로 걸러줍니다)"></div>' +
        '<label style="margin-bottom:8px;display:block;">항목</label>' +
        '<div id="fieldRows"></div>' +
        '<button class="btn-outline btn-sm" id="addFieldBtn" type="button">+ 항목 추가</button>' +
        '<div style="margin-top:20px;"><button class="btn" id="createBtn">만들기</button></div>' +
      '</div>' +
    '</div>'
  );
  const rows = document.getElementById('fieldRows');
  function addRow(name, type) {
    const row = document.createElement('div');
    row.className = 'fieldrow';
    row.innerHTML =
      '<input type="text" class="fname" placeholder="예: 느낀 점" value="' + escapeHtml(name || '') + '">' +
      '<select class="ftype">' +
        '<option value="short"' + (type === 'short' || !type ? ' selected' : '') + '>짧은 텍스트</option>' +
        '<option value="long"' + (type === 'long' ? ' selected' : '') + '>긴 텍스트</option>' +
        '<option value="file"' + (type === 'file' ? ' selected' : '') + '>파일 첨부</option>' +
      '</select>' +
      '<button type="button" class="btn-outline btn-sm delRow">×</button>';
    row.querySelector('.delRow').onclick = function () { row.remove(); };
    rows.appendChild(row);
  }
  addRow('항목1', 'short');
  document.getElementById('addFieldBtn').onclick = function () { addRow('', 'short'); };
  document.getElementById('createBtn').onclick = doCreateTab;
}

async function doCreateTab() {
  const tabName = document.getElementById('tabName').value.trim();
  if (!tabName) return renderNewTab('과제 이름을 입력해주세요.');
  const fields = Array.prototype.slice.call(document.querySelectorAll('#fieldRows .fieldrow')).map(function (row) {
    const name = row.querySelector('.fname').value.trim();
    const type = row.querySelector('.ftype').value;
    if (!name) return null;
    return type === 'long' ? name + '::long' : type === 'file' ? name + '::file' : name;
  }).filter(Boolean);
  if (!fields.length) return renderNewTab('항목을 하나 이상 입력해주세요.');

  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = '만드는 중…';
  let res;
  try { res = await api('addTab', { tabName: tabName, fields: fields }); }
  catch (e) { return; }
  if (!res.success) return renderNewTab(res.message || '만들기에 실패했습니다.');
  renderDetail(tabName);
}

// ---------- 과제 상세 ----------

async function renderDetail(tabName) {
  state.nav = 'tasks';
  state.currentTab = tabName;
  render('<div class="wrap"><div class="loading">불러오는 중…</div></div>');
  let cfg;
  try { cfg = await apiGet('getConfig'); } catch (e) { return; }
  state.config = cfg;
  const tab = (cfg.tabs || []).find(function (t) { return t.sheetName === tabName; });
  if (!tab) return renderDashboard();

  const status = (tab.meta && tab.meta.status) || 'open';
  const teacherFile = tab.meta && tab.meta.teacherFile;

  render(
    '<div class="wrap">' +
      '<a href="#" id="backBtn" class="hint">← 과제 목록</a>' +
      '<h1 class="serif" style="margin-top:8px;">' + escapeHtml(tabName) + '</h1>' +
      (tab.description ? '<p class="lead">' + escapeHtml(tab.description) + '</p>' : '') +
      '<div class="statusbtns" style="max-width:440px;margin-bottom:16px;">' +
        '<button class="btn-outline' + (status === 'wait' ? '' : '') + '" data-status="wait">대기</button>' +
        '<button class="btn-outline" data-status="open">진행중</button>' +
        '<button class="btn-outline" data-status="closed">마감</button>' +
        '<button class="btn-outline btn-danger" id="delTabBtn">삭제</button>' +
      '</div>' +
      '<div class="card wide" style="margin-bottom:16px;">' +
        '<h2>안내 파일 (학생이 내려받는 파일)</h2>' +
        (teacherFile
          ? '<p class="hint">' + escapeHtml(teacherFile.name) + ' · ' + fileSizeLabel(teacherFile.size) + '</p>' +
            '<a class="btn-outline btn-sm" href="' + escapeHtml(teacherFile.url) + '" target="_blank" rel="noopener">열기</a> ' +
            '<button class="btn-outline btn-sm btn-danger" id="clearTeacherFileBtn">삭제</button>'
          : '<p class="hint">아직 올린 파일이 없습니다.</p>') +
        '<div style="margin-top:10px;"><input type="file" id="teacherFileInput"></div>' +
        '<div id="teacherFileMsg"></div>' +
      '</div>' +
      '<div class="tabs">' +
        '<button data-view="roster">명단</button>' +
        '<button data-view="submissions">제출 현황</button>' +
        '<button data-view="log">로그</button>' +
      '</div>' +
      '<div id="detailBody"></div>' +
    '</div>'
  );
  document.getElementById('backBtn').onclick = function (e) { e.preventDefault(); renderDashboard(); };
  document.querySelectorAll('[data-status]').forEach(function (b) {
    if (b.getAttribute('data-status') === status) b.style.background = 'var(--accent)', b.style.color = '#fff', b.style.borderColor = 'transparent';
    b.onclick = function () { doSetStatus(tabName, b.getAttribute('data-status')); };
  });
  document.getElementById('delTabBtn').onclick = function () { doDeleteTab(tabName); };
  document.getElementById('teacherFileInput').onchange = function (e) { doUploadTeacherFile(tabName, e.target.files[0]); };
  const clearBtn = document.getElementById('clearTeacherFileBtn');
  if (clearBtn) clearBtn.onclick = function () { doClearTeacherFile(tabName); };
  document.querySelectorAll('.tabs button').forEach(function (b) {
    if (b.getAttribute('data-view') === state.detailView) b.classList.add('active');
    b.onclick = function () { state.detailView = b.getAttribute('data-view'); renderDetail(tabName); };
  });

  if (state.detailView === 'roster') renderRoster(tab);
  else if (state.detailView === 'submissions') renderSubmissions(tab);
  else renderLog(tab);
}

async function doSetStatus(tabName, status) {
  try { await api('setTabStatus', { tabName: tabName, status: status }); } catch (e) { return; }
  renderDetail(tabName);
}

async function doDeleteTab(tabName) {
  if (!confirm('"' + tabName + '" 과제를 정말 삭제할까요? 학생 답변은 _이전제출 시트에 보관됩니다.')) return;
  try { await api('deleteTab', { tabName: tabName }); } catch (e) { return; }
  renderDashboard();
}

async function doUploadTeacherFile(tabName, file) {
  if (!file) return;
  const msg = document.getElementById('teacherFileMsg');
  if (file.size > 8 * 1024 * 1024) { msg.innerHTML = '<div class="msg error">8MB 이하 파일만 올릴 수 있습니다.</div>'; return; }
  msg.innerHTML = '<div class="hint">올리는 중…</div>';
  const base64 = await fileToBase64(file);
  let res;
  try {
    res = await api('setTeacherFile', {
      tabName: tabName,
      file: { name: file.name, mimeType: file.type, base64: base64 }
    });
  } catch (e) { return; }
  if (!res.success) { msg.innerHTML = '<div class="msg error">' + escapeHtml(res.message || '업로드 실패') + '</div>'; return; }
  renderDetail(tabName);
}

async function doClearTeacherFile(tabName) {
  if (!confirm('안내 파일을 삭제할까요?')) return;
  try { await api('clearTeacherFile', { tabName: tabName }); } catch (e) { return; }
  renderDetail(tabName);
}

async function doSaveRoster(tab) {
  const raw = document.getElementById('rosterRaw').value;
  const lines = raw.split('\n');
  const entries = [];
  lines.forEach(function (line) {
    const t = line.trim();
    if (!t) return;
    const cols = (t.indexOf('\t') >= 0 ? t.split('\t') : t.split(',')).map(function (c) { return c.trim(); });
    const id = cols[0] || '';
    const name = cols[1] || '';
    const code = (cols[2] || '').toUpperCase();
    if (!/^\d{4,10}$/.test(id) || !name) return;
    const entry = { studentId: id, name: name };
    if (/^[A-Z0-9]+$/.test(code)) entry.code = code;
    entries.push(entry);
  });
  const msg = document.getElementById('rosterMsg');
  if (!entries.length) { msg.innerHTML = '<div class="msg error">인식된 줄이 없습니다.</div>'; return; }

  const btn = document.getElementById('saveRosterBtn');
  btn.disabled = true; btn.textContent = '저장 중…';
  let res;
  try { res = await api('saveRoster', { tabName: tab.sheetName, entries: entries }); } catch (e) { return; }
  if (!res.success) { msg.innerHTML = '<div class="msg error">' + escapeHtml(res.message || '저장 실패') + '</div>'; btn.disabled = false; btn.textContent = '저장'; return; }
  renderRoster(tab);
}

async function renderSubmissions(tab) {
  const body = document.getElementById('detailBody');
  body.innerHTML = '<div class="loading">불러오는 중…</div>';
  let res;
  try { res = await api('getSubmissions', { tabName: tab.sheetName }); } catch (e) { return; }
  if (!res.success) { body.innerHTML = '<div class="msg error">' + escapeHtml(res.message || '불러오기 실패') + '</div>'; return; }

  const fields = res.fields || [];
  const rows = res.rows || [];
  const reviewIdx = fields.findIndex(function (f) { return f.type === 'reviewStatus'; });
  const feedbackIdx = fields.findIndex(function (f) { return f.type === 'feedback'; });

  const head = '<tr>' + fields.map(function (f) { return '<th>' + escapeHtml(f.name) + '</th>'; }).join('') + '</tr>';

  const body_ = rows.map(function (r, ri) {
    const sid = r[0];
    return '<tr>' + r.map(function (v, ci) {
      if (ci === reviewIdx) {
        const done = v === '검토완료';
        return '<td><span class="pill ' + (done ? 'open' : 'wait') + '">' + escapeHtml(v || '제출됨') + '</span><br>' +
          '<button class="btn-outline btn-sm reviewToggle" data-row="' + ri + '" data-next="' + (done ? '검토중' : '검토완료') + '" style="margin-top:6px;">' +
          (done ? '검토중으로' : '검토완료로') + '</button></td>';
      }
      if (ci === feedbackIdx) {
        return '<td style="min-width:160px;"><div class="fbtext" style="white-space:pre-wrap;font-size:12px;margin-bottom:6px;">' +
          (v ? escapeHtml(v) : '<span class="hint">없음</span>') + '</div>' +
          '<button class="btn-outline btn-sm fbEditBtn" data-row="' + ri + '">피드백 작성</button></td>';
      }
      return '<td>' + escapeHtml(v) + '</td>';
    }).join('') + '</tr>';
  }).join('');

  body.innerHTML =
    '<p class="hint">총 ' + rows.length + '건</p>' +
    (reviewIdx < 0 ? '<p class="hint">검토상태·피드백 열은 학생이 한 번 이상 제출하면 자동으로 생깁니다.</p>' : '') +
    '<div class="tablewrap"><table>' + head + (body_ || '<tr><td class="hint">제출된 답변이 없습니다.</td></tr>') + '</table></div>' +
    '<button class="btn-outline" id="csvBtn">CSV 내보내기</button>';

  document.getElementById('csvBtn').onclick = function () { exportCsv(tab.sheetName, fields, rows); };

  document.querySelectorAll('.reviewToggle').forEach(function (btn) {
    btn.onclick = async function () {
      const ri = Number(btn.getAttribute('data-row'));
      const sid = rows[ri][0];
      const next = btn.getAttribute('data-next');
      const curFeedback = feedbackIdx >= 0 ? (rows[ri][feedbackIdx] || '') : '';
      btn.disabled = true;
      let res2;
      try { res2 = await api('setReview', { tabName: tab.sheetName, studentId: sid, reviewStatus: next, feedback: curFeedback }); }
      catch (e) { btn.disabled = false; return; }
      if (res2.success) renderSubmissions(tab);
      else { alert(res2.message || '저장 실패'); btn.disabled = false; }
    };
  });

  document.querySelectorAll('.fbEditBtn').forEach(function (btn) {
    btn.onclick = function () {
      const ri = Number(btn.getAttribute('data-row'));
      const cur = feedbackIdx >= 0 ? (rows[ri][feedbackIdx] || '') : '';
      const cell = btn.closest('td');
      cell.innerHTML =
        '<textarea class="fbInput" style="width:100%;box-sizing:border-box;min-height:64px;font-size:12px;font-family:inherit;padding:6px;border:1px solid var(--border);border-radius:6px;">' + escapeHtml(cur) + '</textarea>' +
        '<button class="btn btn-sm fbSaveBtn" style="margin-top:6px;">저장</button>';
      cell.querySelector('.fbSaveBtn').onclick = async function () {
        const sid = rows[ri][0];
        const text = cell.querySelector('.fbInput').value;
        const curStatus = (reviewIdx >= 0 && rows[ri][reviewIdx]) || '검토중';
        let res2;
        try { res2 = await api('setReview', { tabName: tab.sheetName, studentId: sid, reviewStatus: curStatus, feedback: text }); }
        catch (e) { return; }
        if (res2.success) renderSubmissions(tab);
        else alert(res2.message || '저장 실패');
      };
    };
  });
}

function exportCsv(name, fields, rows) {
  function q(v) { v = String(v == null ? '' : v); return '"' + v.replace(/"/g, '""') + '"'; }
  let csv = fields.map(function (f) { return q(f.name); }).join(',') + '\n';
  rows.forEach(function (r) { csv += r.map(q).join(',') + '\n'; });
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '_제출현황.csv';
  a.click();
}

    '<div class="wrap">' +
      '<h1 class="serif">명단</h1>' +
      '<p class="lead">학생명단 시트에서 학번·이름을 가져와요. 학생코드는 아래에 붙여넣은 기존 코드를 쓰고, 없는 학생만 새로 발급해요.</p>' +
      (notice ? '<div class="msg ' + notice.type + '">' + escapeHtml(notice.text) + '</div>' : '') +
      '<div class="card wide"><h2>1. 학생명단 시트 <span class="pill open">연결됨</span></h2>' +
        '<p style="font-size:13px;margin:0 0 6px;">' + escapeHtml(srcState.title) + ' · 시트 «삭제금지» (학년 / 반 / 번호 / 성명)</p>' +
        '<p class="hint" style="margin:0 0 10px;">학번은 <b>학년 + 반(1자리) + 번호(2자리)</b>로 만들어요. 예) 3학년 1반 1번 → 3101</p>' +
        '<div class="stats" style="margin:0;">' + tiles + '</div>' +
        '<p style="margin:12px 0 0;"><a href="#" id="srcChange" class="hint">다른 시트로 바꾸기</a></p>' +
      '</div>' +
      '<div class="card wide"><h2>2. 기존 학생코드 (선택)</h2>' +
        '<p class="hint" style="margin:0 0 8px;">혜원핏 등에서 쓰던 코드를 «학번  코드» 한 줄씩(탭·쉼표·공백 구분) 붙여넣으세요. 이름 열이 끼어 있어도 돼요. 비워두면 이미 서버에 있는 코드는 유지하고 없는 학생만 새로 발급해요.</p>' +
        '<textarea id="codeRaw" placeholder="3101&#9;LX85P5I25"></textarea>' +
        '<div style="margin-top:10px;"><button class="btn-outline" id="codeCheck">코드 확인</button></div>' +
        '<div id="codeSummary" style="margin-top:10px;"></div>' +
      '</div>' +
      '<div class="card wide"><h2>3. 적용할 과제</h2>' +
        (taskRows || '<p class="hint">아직 과제가 없어요. 먼저 «과제» 메뉴에서 과제를 만들어주세요.</p>') +
        '<div style="margin-top:12px;"><button class="btn" id="rsApply"' + (taskRows ? '' : ' disabled') + '>명단 가져오기</button></div>' +
      '</div>' +
      legacy +
    '</div>'
  );
  document.getElementById('srcChange').onclick = function (e) { e.preventDefault(); changeRosterSource(); };
  document.getElementById('codeCheck').onclick = checkCodes;
  document.getElementById('rsApply').onclick = applyRoster;
  document.getElementById('rsParse').onclick = doRosterParse;
}

async function changeRosterSource() {
  const v = prompt('새 학생명단 시트의 주소 또는 ID를 붙여넣으세요');
  if (!v) return;
  let r;
  try { r = await api('setRosterSource', { id: v }); } catch (e) { return; }
  renderRoster(r.success ? { type: 'ok', text: '시트를 바꿨어요.' } : { type: 'error', text: r.message || '바꾸지 못했어요.' });
}
async function saveRosterSource() {
  const v = document.getElementById('srcId').value.trim();
  if (!v) return;
  let r;
  try { r = await api('setRosterSource', { id: v }); } catch (e) { return; }
  renderRoster(r.success ? { type: 'ok', text: '시트를 연결했어요.' } : { type: 'error', text: r.message || '연결하지 못했어요.' });
}

function parseCodes_() {
  const map = {}, bad = [];
  document.getElementById('codeRaw').value.split('\n').forEach(function (line) {
    const t = line.trim();
    if (!t) return;
    const toks = t.split(/[\t, ]+/).filter(Boolean);
    const id = toks.find(function (x) { return /^\d{4}$/.test(x); });
    const code = toks.slice().reverse().find(function (x) { return /^[A-Za-z0-9]{4,}$/.test(x) && !/^\d{4}$/.test(x); });
    if (!id || !code) { bad.push(t); return; }
    map[id] = code.toUpperCase();
  });
  srcState.codes = map;
  return { map: map, bad: bad };
}

function checkCodes() {
  const r = parseCodes_();
  const ids = {}; srcState.students.forEach(function (s) { ids[s.studentId] = 1; });
  const linked = srcState.students.filter(function (s) { return r.map[s.studentId]; }).length;
  const onlyCode = Object.keys(r.map).filter(function (k) { return !ids[k]; });
  const fresh = srcState.students.length - linked;
  document.getElementById('codeSummary').innerHTML =
    '<div class="msg ok" style="margin:0 0 8px;">기존 코드 연결 <b>' + linked + '명</b> · 코드 없음(서버에 있으면 유지, 없으면 새 발급) <b>' + fresh + '명</b></div>' +
    (onlyCode.length ? '<div class="msg warn" style="margin:0 0 8px;">코드표에만 있고 명렬표에는 없는 학번 ' + onlyCode.length + '개: ' + escapeHtml(onlyCode.slice(0, 15).join(', ')) + (onlyCode.length > 15 ? ' …' : '') + '</div>' : '') +
    (r.bad.length ? '<div class="msg warn" style="margin:0;">읽지 못한 줄 ' + r.bad.length + '개</div>' : '');
}

async function applyRoster() {
  const picks = Array.prototype.slice.call(document.querySelectorAll('.rsPick:checked')).map(function (c) { return srcState.tabs[Number(c.getAttribute('data-i'))].sheetName; });
  if (!picks.length) { alert('적용할 과제를 하나 이상 골라주세요.'); return; }
  parseCodes_();

  const removedInfo = [];
  for (const tab of picks) {
    let cur;
    try { cur = await api('getRoster', { tabName: tab }); } catch (e) { return; }
    const keep = {}; targetsFor_(tab).forEach(function (s) { keep[s.studentId] = 1; });
    const removed = ((cur && cur.entries) || []).filter(function (e) { return !keep[e.studentId]; });
    if (removed.length) removedInfo.push(tab + ': 명렬표에 없어서 빠지는 학생 ' + removed.length + '명');
  }
  const summary = picks.map(function (t) { return t + ' (' + targetsFor_(t).length + '명)'; }).join('\n');
  if (!confirm('아래 과제의 명단을 시트 기준으로 바꿀까요?\n\n' + summary + (removedInfo.length ? '\n\n※ ' + removedInfo.join('\n※ ') : ''))) return;

  const btn = document.getElementById('rsApply');
  btn.disabled = true; btn.textContent = '가져오는 중…';
  const done = [];
  for (const tab of picks) {
    const entries = targetsFor_(tab).map(function (s) { return { studentId: s.studentId, name: s.name, code: srcState.codes[s.studentId] || '' }; });
    let r;
    try { r = await api('saveRoster', { tabName: tab, entries: entries }); } catch (e) { return; }
    if (!r || !r.success) return renderRoster({ type: 'error', text: tab + ': ' + ((r && r.message) || '저장에 실패했어요.') });
    done.push(tab + ' ' + entries.length + '명');
  }
  renderRoster({ type: 'ok', text: '가져왔어요 — ' + done.join(' · ') });
}

function doRosterParse() {
  const tabName = document.getElementById('rsTab').value.trim();
  const raw = document.getElementById('rsRaw').value;
  const parsed = [], skipped = [];
  raw.split('\n').forEach(function (line) {
    const t = line.trim();
    if (!t) return;
    const cols = (t.indexOf('\t') >= 0 ? t.split('\t') : t.split(',')).map(function (c) { return c.trim(); });
    const id = cols[0] || '', name = cols[1] || '', code = (cols[2] || '').toUpperCase();
    if (!/^\d{4,10}$/.test(id)) { if (id && id !== '학번') skipped.push(t + '  (학번 형식 아님)'); return; }
    if (!name) { skipped.push(t + '  (이름 없음)'); return; }
    if (!/^[A-Z0-9]+$/.test(code)) { skipped.push(id + ' ' + name + '  (코드 없음/상태표시: ' + (cols[2] || '') + ')'); return; }
    parsed.push({ studentId: id, name: name, code: code });
  });
  rosterState.parsed = parsed; rosterState.skipped = skipped;
  const rows = parsed.map(function (e) { return '<tr><td>' + escapeHtml(e.studentId) + '</td><td>' + escapeHtml(e.name) + '</td><td><span class="code">' + escapeHtml(e.code) + '</span></td></tr>'; }).join('');
  document.getElementById('rsPreview').innerHTML =
    '<div class="card wide">' +
      '<div class="msg ' + (parsed.length ? 'ok' : 'warn') + '">' + parsed.length + '명 인식됨' + (tabName ? ' · 과제: ' + escapeHtml(tabName) : ' · 과제 이름을 입력해주세요') + '</div>' +
      (skipped.length ? '<p class="hint">제외됨 (' + skipped.length + '건): ' + skipped.map(escapeHtml).join(' · ') + '</p>' : '') +
      '<div class="tablewrap"><table><tr><th>학번</th><th>이름</th><th>학생코드</th></tr>' + rows + '</table></div>' +
      '<button class="btn" id="rsSave"' + (parsed.length && tabName ? '' : ' disabled') + '>이 ' + parsed.length + '명 명단에 저장</button>' +
    '</div>';
  const b = document.getElementById('rsSave');
  if (b) b.onclick = function () { doRosterSave(tabName); };
}

async function doRosterSave(tabName) {
  const b = document.getElementById('rsSave');
  b.disabled = true; b.textContent = '저장 중…';
  let res;
  try { res = await api('saveRoster', { tabName: tabName, entries: rosterState.parsed }); } catch (e) { return; }
  state.config = null;
  renderRoster(res && res.success ? { type: 'ok', text: res.message || '저장되었습니다.' } : { type: 'error', text: (res && res.message) || '저장에 실패했습니다.' });
}

// ---------- 공지(푸시 알림) ----------

function renderNotice(notice) {
  state.nav = 'notice';
  render(
    '<div class="wrap">' +
      '<h1 class="serif">공지 보내기</h1>' +
      '<div class="card">' +
        (notice ? '<div class="msg ' + notice.type + '">' + escapeHtml(notice.text) + '</div>' : '') +
        '<div class="field"><label for="ntTitle">제목</label><input id="ntTitle" type="text" maxlength="60" placeholder="예: 내일 체육복 지참"></div>' +
        '<div class="field"><label for="ntBody">내용</label><textarea id="ntBody" rows="5" maxlength="500"></textarea></div>' +
        '<button class="btn" id="sendNoticeBtn">공지 보내기</button>' +
        '<p class="hint" style="margin-top:10px;">보내면 학생 앱 첫 화면에 뜨고, 알림을 켠 학생 휴대폰에는 푸시 알림이 갑니다.</p>' +
      '</div>' +
    '</div>'
  );
  document.getElementById('sendNoticeBtn').onclick = doSendNotice;
}

async function doSendNotice() {
  const title = document.getElementById('ntTitle').value.trim();
  const body = document.getElementById('ntBody').value.trim();
  if (!title && !body) return;
  if (!confirm('이 공지를 학생들에게 보낼까요?')) return;
  const btn = document.getElementById('sendNoticeBtn');
  btn.disabled = true; btn.textContent = '보내는 중…';
  let res;
  try { res = await api('sendNotice', { title: title, body: body }); } catch (e) { return; }
  if (!res.success) return renderNotice({ type: 'error', text: res.message || '보내지 못했습니다.' });
  renderNotice({ type: res.pushReady && res.sent ? 'ok' : 'warn', text: res.message || '공지를 저장했어요.' });
}

// ---------- 설정 ----------

function renderSettings(notice) {
  state.nav = 'settings';
  render(
    '<div class="wrap">' +
      '<h1 class="serif">설정</h1>' +
      '<div class="card">' +
        '<h2>비밀번호 변경</h2>' +
        (notice ? '<div class="msg ' + notice.type + '">' + escapeHtml(notice.text) + '</div>' : '') +
        '<div class="field"><label for="curPw">현재 비밀번호</label><input id="curPw" type="password"></div>' +
        '<div class="field"><label for="newPw">새 비밀번호 (10자 이상)</label><input id="newPw" type="password"></div>' +
        '<button class="btn" id="changePwBtn">변경</button>' +
      '</div>' +
    '</div>'
  );
  document.getElementById('changePwBtn').onclick = doChangePassword;
}

async function doChangePassword() {
  const cur = document.getElementById('curPw').value;
  const next = document.getElementById('newPw').value;
  if (!cur || !next) return;
  let res;
  try { res = await api('changePassword', { currentPassword: cur, newPassword: next }); } catch (e) { return; }
  if (!res.success) return renderSettings({ type: 'error', text: res.message || '변경 실패' });
  state.token = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  renderLogin('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
}

boot();
</script>
