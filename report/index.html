// ---------- 피드백 속 링크: 눌러서 바로 열기 + 썸네일 카드 ----------
const URL_RE_ = /https?:\/\/[^\s<>"'«»]+/g;
function cleanUrl_(u) { return String(u).replace(/[).,!?;:」』”’]+$/, ''); }
function linkifyHtml_(text) {
  text = String(text || ''); let out = '', last = 0, m;
  URL_RE_.lastIndex = 0;
  while ((m = URL_RE_.exec(text))) {
    const u = cleanUrl_(m[0]);
    out += escapeHtml(text.slice(last, m.index)) + '<a class="lk-in" href="' + escapeHtml(u) + '" target="_blank" rel="noopener">' + escapeHtml(u.length > 60 ? u.slice(0, 57) + '…' : u) + '</a>';
    last = m.index + u.length;
  }
  return out + escapeHtml(text.slice(last));
}
function linkKind_(u) {
  let x; try { x = new URL(u); } catch (e) { return null; }
  const h = x.hostname.replace(/^www\.|^m\./, ''), path = x.pathname;
  let yt = '';
  if (h === 'youtu.be') yt = path.slice(1).split('/')[0];
  else if (h === 'youtube.com') yt = x.searchParams.get('v') || ((/^\/(shorts|embed|live)\/([\w-]{6,})/.exec(path) || [])[2] || '');
  if (yt && /^[\w-]{6,}$/.test(yt)) return { icon: '▶', bg: '#E5484D', title: 'YouTube 영상', site: 'youtube.com', thumb: 'https://i.ytimg.com/vi/' + yt + '/hqdefault.jpg' };
  if (h === 'claude.ai' && /artifact/.test(path)) return { icon: '✦', bg: 'linear-gradient(135deg,#D97757,#A3262E)', title: '발표·자료 페이지', site: 'claude.ai' };
  if (h === 'docs.google.com') {
    const k = (/^\/(presentation|document|spreadsheets|forms)\//.exec(path) || [])[1];
    const M = { presentation: ['구글 슬라이드', '#F4B400', '▭'], document: ['구글 문서', '#4285F4', '≡'], spreadsheets: ['구글 시트', '#0F9D58', '▦'], forms: ['구글 설문', '#7248B9', '☑'] }[k];
    if (M) return { icon: M[2], bg: M[1], title: M[0], site: 'docs.google.com' };
  }
  if (h === 'drive.google.com') return { icon: '▲', bg: '#1FA463', title: '구글 드라이브 파일', site: 'drive.google.com' };
  return { icon: '🔗', bg: 'var(--hyewon-emerald, #087A55)', title: h, site: h };
}
function linkCardsHtml_(text) {
  const seen = {}, urls = [];
  (String(text || '').match(URL_RE_) || []).forEach(function (u) { u = cleanUrl_(u); if (!seen[u] && urls.length < 4) { seen[u] = 1; urls.push(u); } });
  return urls.map(function (u) {
    const k = linkKind_(u); if (!k) return '';
    return '<a class="lk" href="' + escapeHtml(u) + '" target="_blank" rel="noopener" data-lk="' + escapeHtml(u) + '">' +
      '<span class="lk-th" style="background:' + k.bg + ';">' + (k.thumb ? '<img src="' + escapeHtml(k.thumb) + '" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'i\'),{textContent:\'' + k.icon + '\'}))">' : '<i>' + k.icon + '</i>') + '</span>' +
      '<span class="lk-t"><b>' + escapeHtml(k.title) + '</b><small>' + escapeHtml(k.site) + ' · 눌러서 열기</small></span><span class="lk-go">↗</span></a>';
  }).join('');
}
// 서버(v70~)가 그 페이지의 대표 사진·제목(og:image·og:title)을 알려 주면 카드에 채워요.
state.linkPrev = {};
function fillLinkCards_() {
  if (Number(state.config && state.config.serverVersion) < 70) return;
  document.querySelectorAll('a.lk[data-lk]').forEach(function (a) {
    const u = a.getAttribute('data-lk');
    const put = function (r) {
      if (!r || !document.body.contains(a)) return;
      if (r.title) a.querySelector('.lk-t b').textContent = r.title;
      const th = a.querySelector('.lk-th');
      if (r.image && !th.querySelector('img')) { const im = new Image(); im.alt = ''; im.referrerPolicy = 'no-referrer'; im.onload = function () { th.innerHTML = ''; th.appendChild(im); th.style.background = '#000'; }; im.src = r.image; }
    };
    if (state.linkPrev[u]) return put(state.linkPrev[u]);
    apiOnce_('linkPreview', { url: u }).then(function (r) { if (r && r.success) { state.linkPrev[u] = r; put(r); } }).catch(function () {});
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

document.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-link]');
  if (!btn) return;
  const link = btn.getAttribute('data-link');
  navigator.clipboard.writeText(link).then(function () {
    const old = btn.textContent;
    btn.textContent = '복사됨';
    setTimeout(function () { btn.textContent = old; }, 1500);
  });
});

// ---------- PWA 설치 · 푸시 알림(FCM) · 공지 ----------

/* 파이어베이스 콘솔 «프로젝트 설정 → 일반 → 내 앱(웹)» 값. 비어 있으면 «알림 받기» 버튼은 숨겨집니다.
   sw.js 맨 위 FCM_CONFIG 에도 «똑같이» 채워야 합니다(앱이 닫혀 있을 때의 수신은 서비스워커가 처리). */
const FCM_CONFIG = { apiKey: 'AIzaSyBtpG79Dr6u-pLz3FiwebWf3v8Qq16OXv8', authDomain: 'hyewon-portal.firebaseapp.com', projectId: 'hyewon-portal', storageBucket: 'hyewon-portal.firebasestorage.app', messagingSenderId: '926603414719', appId: '1:926603414719:web:a068b0a313ca0986834a0a' };
const FCM_VAPID_KEY = 'BOwJEUn05ciuh9lZu39bDZEHAOfoqGj_AKSXaXFro6UNCZzPiPgfRP-mUTegraLSHwMkOZ43d5dFN774pOGzyoQ';
const NOTI_KEY = 'hyewon_noti_on';

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; paintExtras_(); });
window.addEventListener('appinstalled', function () { deferredInstall = null; paintExtras_(); });

function isStandalone_() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS_() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function notiOn_() {
  try { return window.Notification && Notification.permission === 'granted' && localStorage.getItem(NOTI_KEY) === '1'; } catch (e) { return false; }
}
function pushSupported_() {
  return !!(FCM_CONFIG.apiKey && FCM_VAPID_KEY && 'serviceWorker' in navigator && 'Notification' in window);
}

function paintExtras_() {
  const box = document.getElementById('extras');
  if (!box) return;
  let html = '';
  const canPush = pushSupported_() && !isPeek_() && !(state.login && state.login.master);
  const on = canPush && notiOn_();
  if (!isStandalone_()) {
    if (deferredInstall) html += '<button id="installBtn" class="install-btn">📲 홈 화면에 앱 설치하기</button>';
    else if (isIOS_()) html += '<p class="hint">아이폰: Safari 공유 버튼 → «홈 화면에 추가»를 누르면 앱처럼 쓰고 알림도 받을 수 있어요.</p>';
  }
  if (canPush && !on) {
    const denied = window.Notification && Notification.permission === 'denied';
    const needInstall = isIOS_() && !isStandalone_();
    html += '<div class="noti-card"><div class="noti-ic">🔔</div><div class="noti-tx"><b>알림 받기</b>' +
      '<small>' + (denied ? '알림이 차단돼 있어요. 휴대폰 설정 → 앱(또는 브라우저) → 알림에서 혜원포털을 허용해 주세요.'
        : needInstall ? '아이폰은 먼저 홈 화면에 설치한 뒤 앱에서 켤 수 있어요.'
        : '새 과제 · 마감 알림 · 반려 소식을 앱을 닫아도 휴대폰으로 받아요.') + '</small></div>' +
      (denied || needInstall ? '' : '<button id="notiBtn" type="button">켜기</button>') + '</div>';
  }
  if (on) html += '<p class="hint noti-on">🔔 알림 받는 중 · <a href="#" id="notiOff">끄기</a></p>';

  const ib = document.getElementById('installBtn');
  if (ib) ib.onclick = function () {
    if (!deferredInstall) return;

    deferredInstall.userChoice.finally(function () { deferredInstall = null; paintExtras_(); });
  };
  const nb = document.getElementById('notiBtn');
  if (nb) nb.onclick = function () { notiEnable_(); };
  const no = document.getElementById('notiOff');
  if (no) no.onclick = function (e) { e.preventDefault(); if (confirm('알림을 끌까요? 새 과제·마감 알림이 오지 않아요.')) notiDisable_(); };
}

// 알림을 켜 둔 기기는 앱을 열 때마다 토큰을 다시 등록해요(토큰이 바뀌었거나, 같은 폰에서 다른 학생이 로그인한 경우).
async function notiRefresh_() {
  try {
    if (!notiOn_() || !state.login || !state.login.code || state.login.master || isPeek_()) return;
    const key = 'hyewon_noti_sync';
    const mark = state.login.studentId + '|' + new Date().toDateString();
    if (sessionStorage.getItem(key) === mark) return;
    if (!window.firebase || !firebase.messaging) {
      await loadScript_('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript_('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    }
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FCM_CONFIG);
    const reg = await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) return;
    const r = await api('saveNotiToken', { studentId: state.login.studentId, code: state.login.code, token: token, ua: navigator.userAgent });
    if (r && r.success) sessionStorage.setItem(key, mark);
  } catch (e) {}
}

function loadScript_(src) {
  return new Promise(function (res, rej) {
    if (document.querySelector('script[src="' + src + '"]')) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = function () { res(); }; s.onerror = function () { rej(new Error('load ' + src)); };
    document.head.appendChild(s);
  });
}

async function notiEnable_() {
  if (isIOS_() && !isStandalone_()) { alert('아이폰은 먼저 홈 화면에 앱을 설치해야 알림을 켤 수 있어요.'); return; }
  const nb = document.getElementById('notiBtn');
  if (nb) nb.disabled = true;
  try {
    if (!window.firebase || !firebase.messaging) {
      await loadScript_('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript_('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    }
    const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (perm !== 'granted') { alert('알림 창에서 «허용»을 눌러야 켜져요.'); return; }
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FCM_CONFIG);
    const reg = await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error('토큰 없음');
    const r = await api('saveNotiToken', { studentId: state.login.studentId, code: state.login.code, token: token, ua: navigator.userAgent });
    if (!r.success) { alert(r.message || '알림을 켜지 못했어요.'); return; }
    localStorage.setItem(NOTI_KEY, '1');
  } catch (e) {
    console.warn('알림 켜기 실패', e);
    alert('알림을 켜지 못했어요. 잠시 후 다시 시도해 주세요.');
  } finally {
    paintExtras_();
  }
}

async function notiDisable_() {
  try { localStorage.setItem(NOTI_KEY, '0'); } catch (e) {}
  try {
    if (window.firebase && firebase.apps && firebase.apps.length) {
      const token = await firebase.messaging().getToken({ vapidKey: FCM_VAPID_KEY });
      if (token) { api('removeNotiToken', { token: token }); firebase.messaging().deleteToken().catch(function () {}); }
    }
  } catch (e) {}
  paintExtras_();
}

async function loadNotices_() {
  const area = document.getElementById('noticeArea');
  if (!area || !state.login || isPeek_()) return;
  try {
    const r = await api('getNotices', { studentId: state.login.studentId, code: state.login.code });
    if (!r || !r.success || !r.notices || !r.notices.length) return;
    const n = r.notices[0];
    area.innerHTML = '<div class="notice-box"><b>' + escapeHtml(n.title) + '</b>' +
      (n.body ? '<p>' + escapeHtml(n.body) + '</p>' : '') + '<small>' + escapeHtml(n.at) + '</small></div>';
  } catch (e) {}
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
