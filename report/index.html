<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>혜원포털</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#087A55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="혜원포털">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  :root {
    --hyewon-emerald:#087A55; --hyewon-coral:#F04E68; --hyewon-cream:#FFFCF6;
    --hyewon-mint:#E5F4EE; --hyewon-ink:#183A35; --hyewon-muted:#72827E; --hyewon-border:#E5EAE7;

    --bg: var(--hyewon-cream); --surface:#FFFFFF; --text: var(--hyewon-ink); --text2: var(--hyewon-muted); --text3:#9AA79F;
    --border: var(--hyewon-border); --accent: var(--hyewon-emerald); --accent-dark:#065F44;
    --success-bg: var(--hyewon-mint); --success-text: var(--hyewon-emerald);
    --error-bg:#FDEAEC; --error-text: var(--hyewon-coral);
    --warn-bg:#FFF4E0; --warn-text:#9A6400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; }
  .serif { font-family: 'Noto Serif KR', serif; }
  .dongle { font-family: 'Dongle', sans-serif; font-weight: 700; display: block; margin: 0; line-height: 1; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { padding: 18px 20px 0; display: flex; justify-content: space-between; align-items: center; }
  .topbar .brand { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--text2); }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .pill.open { color: var(--success-text); background: var(--success-bg); }
  .pill.wait { color: var(--text2); background: #EFEDE7; }
  .pill.closed { color: var(--text2); background: #EFEDE7; }
  .head { padding: 12px 20px 18px; }
  .head h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3; }
  .head p { margin: 6px 0 0; font-size: 14px; color: var(--text2); }
  .main { flex-grow: 1; padding: 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(28,27,26,0.04); }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label { font-size: 13px; font-weight: 600; color: var(--text2); }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 13px 14px; font-size: 16px; border: 1px solid var(--border); border-radius: 10px; background: #FCFCFB; font-family: inherit; color: var(--text); }
  textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
  .otp { display: flex; gap: 6px; justify-content: flex-start; }
  .otp input { flex: 1 1 0; min-width: 0; max-width: 40px; padding: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; aspect-ratio: 3 / 4; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,111,237,0.12); }
  .hint { font-size: 12px; color: var(--text3); }
  .btn { display: block; width: 100%; text-align: center; text-decoration: none; background: var(--hyewon-coral); color: #fff; font-size: 16px; font-weight: 600; padding: 14px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #D93F59; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-outline { display: block; width: 100%; text-align: center; text-decoration: none; background: #fff; color: var(--text); font-size: 14px; font-weight: 600; padding: 12px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; font-family: inherit; }
  .linklike { display: block; text-align: center; font-size: 12px; color: var(--text2); text-decoration: underline; text-underline-offset: 2px; background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px; }
  .msg { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  .msg.error { background: var(--error-bg); color: var(--error-text); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-text); }
  .msg.ok { background: var(--success-bg); color: var(--success-text); }
  .identity { margin: 0 0 16px; background: var(--success-bg); border: 1px solid #BFE6CB; border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .identity b { display: block; font-size: 14px; font-weight: 700; }
  .identity small { display: block; font-size: 12px; color: var(--success-text); }
  .badge-anti { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--warn-text); background: var(--warn-bg); padding: 3px 8px; border-radius: 999px; }
  .rowbetween { display: flex; justify-content: space-between; align-items: center; }
  .upload { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px; border: 1.5px dashed #C9C5BA; border-radius: 10px; background: #FCFCFB; color: var(--text2); font-size: 13px; text-align: center; }
  .upload input { display: none; }
  .footer { padding: 18px 20px 28px; text-align: center; }
  .footer span { font-size: 11px; color: var(--text3); }
  .center-pad { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; }
  .picklist { display: flex; flex-direction: column; gap: 8px; }
  .picklist a { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: var(--text); font-weight: 600; font-size: 15px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px; }
  .success-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--success-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .teacher-box { margin-top: 24px; border-top: 1px dashed var(--border); padding-top: 16px; }
  .teacher-box summary { font-size: 12px; color: var(--text3); cursor: pointer; }
  .teacher-box .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .teacher-box .row input { flex-grow: 1; padding: 10px 12px; font-size: 13px; }
  .teacher-box .smallbtn { flex-shrink: 0; padding: 10px 14px; font-size: 13px; }
  .teacher-box .note { font-size: 12px; color: var(--text3); margin: 8px 0; }
  .charcount { font-size: 12px; color: var(--text3); }
  .grade-links { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

  /* 로그인 화면 */
  .login-page { position: relative; min-height: 100vh; display: flex; flex-direction: column; }
  .tagline { text-align: center; font-size: 12px; color: var(--text3); margin-top: 18px; }

  /* 상단 앱바 · 하단 탭바 (레퍼런스 반영) */
  .notice-box { background: #FFFBEA; border: 1px solid #F0DFA8; border-radius: 14px; padding: 12px 14px; margin: 0 20px 12px; }
  .notice-box b { display: block; font-size: 13px; color: #6A5A14; margin-bottom: 4px; }
  .notice-box p { margin: 0; font-size: 13px; line-height: 1.6; color: #5A4A12; white-space: pre-wrap; }
  .notice-box small { display: block; margin-top: 6px; font-size: 11px; color: #A8913A; }
  .extras { margin: 16px 20px 0; display: flex; flex-direction: column; gap: 8px; }
  .extras button { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .extras button.on { background: var(--hyewon-mint); color: var(--hyewon-emerald); border-color: transparent; }
  .extras .hint { text-align: center; }
  .peekbar { background: #4B3BB5; color: #fff; font-size: 12.5px; font-weight: 700; text-align: center; padding: 6px 10px; flex-shrink: 0; }
  .appbar { flex-shrink: 0; background: var(--hyewon-emerald); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
  .appbar .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 800; font-size: 16px; }
  .appbar .brand img { width: 26px; height: 26px; }
  .appbar .icons { display: flex; align-items: center; gap: 14px; }
  .appbar .icons button, .appbar .icons a { background: none; border: none; padding: 0; cursor: pointer; display: flex; }
  .bottombar { flex-shrink: 0; background: #fff; border-top: 1px solid var(--border); padding: 8px 10px 14px; display: flex; justify-content: space-around; margin-top: 8px; }
  .bottombar .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; font-family: inherit; }
  .bottombar .tab span { font-size: 10px; }
  .bottombar .tab.active span { color: var(--hyewon-emerald); font-weight: 700; }
  .bottombar .tab:not(.active) span { color: var(--text3); }

  /* 오늘의 과제 — 단계 스테퍼 · 종목 아이콘 카드 */
  .stepper { display: flex; align-items: center; gap: 4px; padding: 0 20px 16px; }
  .stepper .step { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 46px; }
  .stepper .dot { width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .stepper .dot.active { background: var(--hyewon-coral); color: #fff; }
  .stepper .dot.idle { background: var(--hyewon-mint); color: var(--text3); }
  .stepper .label { font-size: 10px; }
  .stepper .label.active { color: var(--hyewon-coral); font-weight: 700; }
  .stepper .label.idle { color: var(--text3); }
  .stepper .bar { flex-grow: 1; height: 2px; background: var(--hyewon-mint); }
  .sporticon { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; }
  .sporticon svg { display: block; }
  .assign-list { display: flex; flex-direction: column; gap: 10px; }
  .assign-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; text-decoration: none; color: var(--text); }
  .assign-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1; }
  .assign-title { font-weight: 700; font-size: 15px; }
  .assign-sub { font-size: 12px; color: var(--text2); }
  .assign-time { font-size: 12px; color: var(--text3); }
  .assign-chev { flex-shrink: 0; color: var(--text3); }
  .rpill { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .rpill.none { color: var(--text2); background: #EFEDE7; }
  .rpill.pending { color: var(--warn-text); background: var(--warn-bg); }
  .rpill.done { color: var(--success-text); background: var(--success-bg); }

  /* 과제 상세 · 제출 현황 */
  .info-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); margin-bottom: 14px; }
  .info-row b { font-weight: 600; color: var(--text); }
  .detail-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .detail-card .row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .detail-card .row-head b { font-size: 14px; }
  .file-chip { display: flex; align-items: center; gap: 10px; background: var(--hyewon-mint); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .file-chip b { display: block; font-size: 14px; }
  .feedback-box { background: var(--hyewon-mint); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .feedback-box b { display: block; font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .feedback-box p { margin: 0; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .submitted-file { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-decoration: none; color: inherit; }
  .submitted-file .thumb { width: 54px; height: 54px; border-radius: 10px; background: var(--hyewon-ink); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  /* 성적 */
  .score-hero { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .score-who { font-size: 13px; color: var(--text2); margin-bottom: 12px; }
  .score-who b { color: var(--text); font-size: 16px; margin-left: 4px; }
  .score-big { display: flex; gap: 12px; }
  .score-big > div { flex: 1; background: var(--hyewon-mint); border-radius: 12px; padding: 12px 14px; }
  .score-big small { display: block; font-size: 11px; color: var(--text2); margin-bottom: 2px; }
  .score-big strong { font-size: 26px; font-weight: 800; color: var(--hyewon-emerald); line-height: 1.2; }
  .score-big strong em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--text2); margin-left: 3px; }
  .score-big .grade strong { color: var(--hyewon-coral); }
  .score-criteria { margin: 10px 2px 0; font-size: 11.5px; color: var(--text3); text-align: center; line-height: 1.6; }
  .score-cat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .score-cat h3 { margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 800; }
  .score-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .score-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; padding: 3px 0; }
  .score-row span { color: var(--text2); min-width: 0; overflow-wrap: anywhere; }
  .score-row b { font-weight: 700; flex-shrink: 0; }
  .score-row b.empty { color: var(--text3); font-weight: 500; }
  @media (max-width: 380px) { .score-rows { grid-template-columns: 1fr; } }

  /* 태블릿(디벗 등)·큰 화면 — 폭을 넓히고 글자·입력칸·버튼을 키웁니다 */
  @media (min-width: 640px) {
    #app { max-width: 640px; }
    .topbar { padding: 24px 32px 0; }
    .head { padding: 16px 32px 22px; }
    .head h1 { font-size: 30px; }
    .head p { font-size: 15px; }
    .main, .center-pad { padding-left: 32px; padding-right: 32px; }
    .card { padding: 32px 28px; border-radius: 18px; }
    label { font-size: 14px; }
    input[type=text], textarea { font-size: 17px; padding: 15px 16px; }
    textarea { min-height: 170px; }
    .btn, .btn-outline { font-size: 17px; padding: 16px; }
    .upload { padding: 30px; font-size: 14px; }
    .footer { padding: 22px 32px 32px; }
    .otp input { padding: 0; font-size: 22px; }
    .assign-card { padding: 16px 18px; border-radius: 16px; }
    .assign-title { font-size: 16px; }
    .appbar { padding: 18px 32px; }
    .bottombar { padding: 10px 24px 16px; }
  }
  @media (min-width: 900px) {
    #app { max-width: 760px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>

<script>
const state = {
  exec: '',
  toolCfg: null,   // routes.json 의 tools.report (label, gradePrefixes 등)
  grade: '',
  tab: '',
  config: null,
  login: null,   // { studentId, studentName, code }
  globalMode: false,   // 과제를 먼저 고르지 않고 로그인부터 하는 흐름(오늘의 과제)
  myTabs: null,        // getMySubmissions() 결과 — 이 학생이 속한 모든 과제의 제출 현황
  currentEntry: null,  // globalMode에서 지금 보고 있는 과제의 myTabs 항목
  antiPaste: { pasteTries: 0, maxChunk: 0, chunks: 0, deletes: 0, startedAt: 0 }
};

const LOGIN_KEY = 'hyewon_report_login';   // 한 번 로그인하면 이 기기에서는 다시 묻지 않습니다(학번/학생코드만 저장).

function qs(name) { return new URLSearchParams(location.search).get(name) || ''; }

function saveLogin(studentId, code) {
  try { localStorage.setItem(LOGIN_KEY, JSON.stringify({ studentId: studentId, code: code })); } catch (e) {}
}
function loadLogin() {
  try {
    const v = JSON.parse(localStorage.getItem(LOGIN_KEY) || 'null');
    if (v && v.studentId && v.code) return v;
  } catch (e) {}
  return null;
}
function clearLogin() {
  try { localStorage.removeItem(LOGIN_KEY); } catch (e) {}
}

function render(html) {
  document.getElementById('app').innerHTML = html;
}

function brandLabel() {
  return (state.toolCfg && state.toolCfg.label) || (state.config && state.config.title) || '과제 제출';
}

async function api(action, data, method) {
  method = method || 'POST';
  if (method === 'GET') {
    const url = new URL(state.exec);
    url.searchParams.set('action', action);
    if (data) url.searchParams.set('data', JSON.stringify(data));
    const res = await fetch(url.toString());
    return res.json();
  }
  const body = new URLSearchParams();
  body.set('action', action);
  if (data) body.set('data', JSON.stringify(data));
  const res = await fetch(state.exec, { method: 'POST', body: body });
  return res.json();
}

function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () { resolve(String(reader.result).split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function statusLabel(s) {
  return s === 'open' ? '진행중' : s === 'wait' ? '대기' : '마감';
}

// ---------- 부팅 ----------
// 실제 /exec 주소는 이 화면에 직접 넣지 않고, 같은 사이트의 routes.json에서 읽어옵니다.
// 시트를 새로 만들어 주소가 바뀌어도(예: 매년 새 학년도) routes.json 한 곳만 고치면
// 학생들이 쓰는 이 링크(QR 포함)는 그대로 유지됩니다.

async function boot() {
  state.tab = qs('tab') || '';
  state.tabsFilter = qs('tabs') ? qs('tabs').split(',').map(function (s) { return s.trim(); }).filter(Boolean) : null;
  state.groupLabel = qs('label') || '';
  state.grade = qs('grade') || '';

  const override = qs('exec');
  if (override) {
    state.exec = override;
  } else {
    try {
      const routes = await (await fetch('../routes.json')).json();
      const tool = routes.tools && routes.tools.report;
      if (!tool || !tool.exec) throw new Error('not-configured');
      state.toolCfg = tool;
      state.exec = tool.exec;
    } catch (e) {
      return renderSetup();
    }
  }

  try {
    state.config = await api('getConfig', null, 'GET');
  } catch (e) {
    return renderError('서버에 연결할 수 없습니다. 인터넷 연결을 확인하거나 선생님께 문의해주세요.');
  }
  if (!state.config || !state.config.tabs) {
    return renderError('서버에 연결할 수 없습니다. 주소가 올바른지 확인해주세요.');
  }

  // 과제·학년을 특정하는 값이 전혀 없는 "맨 주소"(허브에서 들어오는 기본 진입점)는
  // 학번+학생코드로 먼저 로그인하고 "오늘의 과제"를 보여주는 새 흐름으로 갑니다.
  // ?grade= 나 ?tab= 처럼 선생님이 이미 나눠준 링크/QR은 예전 흐름 그대로 둡니다.
  if (!state.tab && !state.grade && !state.tabsFilter) {
    state.globalMode = true;
    const savedGlobal = loadLogin();
    if (savedGlobal) { return tryGlobalAutoLogin(savedGlobal); }
    return renderGlobalLogin();
  }

  if (!state.tab) { return renderPicker(); }

  const tab = state.config.tabs.find(function (t) { return t.sheetName === state.tab; });
  if (!tab) { return renderError('요청하신 과제를 찾을 수 없습니다.'); }

  const status = (tab.meta && tab.meta.status) || 'open';
  if (status === 'wait') { return renderBlocked(tab, '아직 시작 전인 과제입니다. 선생님이 시작하면 제출할 수 있어요.'); }
  if (status === 'closed') { return renderBlocked(tab, '이 과제는 제출이 마감되었습니다.'); }

  const saved = loadLogin();
  if (saved) { return tryAutoLogin(tab, saved); }

  renderLogin(tab);
}

async function tryAutoLogin(tab, saved) {
  render('<div class="loading">불러오는 중…</div>');
  let res;
  try {
    res = await api('studentLogin', { tabName: tab.sheetName, studentId: saved.studentId, code: saved.code });
  } catch (e) {
    return renderLogin(tab);

  state.login = { studentId: saved.studentId, studentName: res.studentName, code: saved.code, master: !!res.master };

}

async function doGlobalLogin() {
  const studentId = otpValue('otpId');
  const code = otpValue('otpCode');
  if (!studentId || !code) { return renderGlobalLogin('학번과 학생코드를 모두 입력해주세요.'); }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '확인 중…';

  let res;
  try {
    res = await api('getMySubmissions', { studentId: studentId, code: code });
  } catch (e) {
    return renderGlobalLogin('서버에 연결할 수 없습니다. 다시 시도해주세요.');
  }
  if (!res.success) { return renderGlobalLogin(res.message || '로그인에 실패했습니다.'); }

  state.login = { studentId: studentId, studentName: res.studentName, code: code, master: !!res.master };
  state.myTabs = res.tabs || [];
  saveLogin(studentId, code);
  renderToday();
}

  if (!entry.submitted) return 'none';

function fileSizeLabel(bytes) {
  bytes = Number(bytes) || 0;
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'KB';
  return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
}

// 피클볼·킨볼·배드민턴처럼 해당하는 유니코드 이모지가 없는 종목은 같은 화풍의 커스텀 SVG를 씁니다.
function sportIcon_(name) {
  name = String(name || '');
  const table = [
    { kw: '발리볼', kind: 'emoji', char: '🏐' },
    { kw: '베이스볼', kind: 'emoji', char: '🥎' },
    { kw: '킨볼', kind: 'kinball' },
    { kw: '피클볼', kind: 'pickleball' },

    { kw: '농구', kind: 'emoji', char: '🏀' },
    { kw: '독서', kind: 'emoji', char: '📖' },

}

function wireChrome_() {
  document.querySelectorAll('[data-nav]').forEach(function (b) {

      const key = b.getAttribute('data-nav');
      if (key === 'home' || key === 'today') { renderToday(); return; }

  render(
    appbarHtml_('', false) +
    '<div class="head"><h1 style="margin:0;font-size:21px;font-weight:800;">내 성적</h1>' +
      '<p>체육 수행평가 점수를 확인해요.</p></div>' +

    '<div class="footer"><span>Made by Eagle Teacher · 교육 목적</span></div>' +
    bottombarHtml_('score')
  );
  wireChrome_();
  const body = document.getElementById('scoreBody');
  let res;
  try {
    res = await api('getMyScores', { studentId: state.login.studentId, code: state.login.code });
  } catch (e) {
    res = { success: false, message: '네트워크 문제로 불러오지 못했어요. 잠시 후 다시 시도해주세요.' };
  }
  if (!document.getElementById('scoreBody')) return;   // 그 사이 다른 화면으로 옮겨 갔으면 그리지 않습니다
  if (!res || res.success === false || res.error) {
    body.innerHTML = '<div class="card"><div class="msg error" style="margin-bottom:12px;">' +
      escapeHtml((res && res.message) || '성적을 불러오지 못했어요.') + '</div>' +
      '<button class="btn-outline" id="scoreRetry">다시 시도</button></div>';
    document.getElementById('scoreRetry').onclick = renderScore_;
    return;
  }
  if (!res.found) {
    body.innerHTML = '<div class="card" style="text-align:center;"><p class="hint" style="font-size:14px;">' +
      escapeHtml(res.message || '아직 성적이 입력되지 않았어요.') + '</p></div>';
    return;
  }
  body.innerHTML = scoreHtml_(res);
}

function scoreHtml_(r) {
  const total = r.totalScore === '' ? '-' : escapeHtml(r.totalScore);
  const grade = r.grade === '' ? '-' : escapeHtml(r.grade);
  const criteria = (r.criteria && r.criteria.length)
    ? '<div class="score-criteria">등급 기준 · ' + r.criteria.map(function (c) {
        return escapeHtml(c.grade) + ' ' + escapeHtml(c.desc);
      }).join(' &nbsp;/&nbsp; ') + '</div>'
    : '';
  const cats = (r.groups || []).map(function (g) {
    const rows = g.items.map(function (it) {
      const empty = it.value === '';
      return '<div class="score-row"><span>' + escapeHtml(it.key) + '</span><b' + (empty ? ' class="empty"' : '') + '>' +
        (empty ? '-' : escapeHtml(it.value)) + '</b></div>';
    }).join('');

function teacherLinkBox() {
  const gradeRows = (state.toolCfg && state.toolCfg.gradePrefixes)

    const link = location.origin + location.pathname + '?tab=' + encodeURIComponent(t.sheetName);
    return '<div class="row"><input readonly value="' + escapeHtml(link) + '"><button class="btn-outline smallbtn" data-link="' + escapeHtml(link) + '">복사</button></div>';
  }).join('');

  const checks = state.config.tabs.map(function (t) {
    return '<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;">' +
      '<input type="checkbox" class="grpChk" data-name="' + escapeHtml(t.sheetName) + '" checked> ' + escapeHtml(t.sheetName) +
    '</label>';
  }).join('');

  return '<details class="teacher-box" open><summary>교사용 — 학생 링크 만들기</summary>' +
    (gradeRows ? (
      '<div class="note">학년별 고정 링크 — 과제 이름이 그 학년 접두어로 시작하면 자동으로 걸러집니다. <strong>매년 시트를 새로 만들어도 이 링크(QR)는 그대로 재사용</strong>됩니다.</div>' +
      '<div class="grade-links">' + gradeRows + '</div>'
    ) : '') +
    '<div class="note">과제별 바로가기</div>' + rows +
    '<div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);">' +
      '<div class="note">여러 과제를 임시로 묶어서 링크 만들기 — 이 링크는 과제 이름이 바뀌면 다시 만들어야 합니다.</div>' +
      '<div class="field"><label for="grpLabel">이 링크의 이름 (선택, 화면 상단에 표시됨)</label>' +
      '<input id="grpLabel" type="text" placeholder="예: 방과후반"></div>' +
      checks +
      '<div class="row" style="margin-top:12px;">' +
        '<input readonly id="grpLink" value="">' +
        '<button class="btn-outline smallbtn" id="grpCopy">복사</button>' +
      '</div>' +
    '</div>' +
  '</details>';
}

function updateGroupLink() {
  const boxes = Array.prototype.slice.call(document.querySelectorAll('.grpChk'));
  const all = boxes.map(function (b) { return b.getAttribute('data-name'); });
  const checked = boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.getAttribute('data-name'); });
  const label = document.getElementById('grpLabel').value.trim();

  let link = location.origin + location.pathname + '?';
  const parts = [];
  if (checked.length && checked.length < all.length) {
    parts.push('tabs=' + checked.map(encodeURIComponent).join(','));
  }
  if (label) parts.push('label=' + encodeURIComponent(label));
  link += parts.join('&');

  const linkInput = document.getElementById('grpLink');
  if (linkInput) linkInput.value = link;
  const copyBtn = document.getElementById('grpCopy');
  if (copyBtn) copyBtn.setAttribute('data-link', link);
}

        '<div class="otp" id="otpCode">' + otpBoxesHtml(9, false) + '</div>' +

      '</div>' +
    '</div>' +
    '<div class="footer"><span>Made by Eagle Teacher · 교육 목적</span></div>'
  );

  wireOtp('otpId', true);
  wireOtp('otpCode', false);
  document.getElementById('loginBtn').onclick = function () { doLogin(tab); };
  document.getElementById('otpCode').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin(tab);
  });
  const first = document.querySelector('#otpId input');
  if (first) first.focus();
}

async function doLogin(tab) {
  const studentId = otpValue('otpId');
  const code = otpValue('otpCode');
  if (!studentId || !code) { return renderLogin(tab, '학번과 학생코드를 모두 입력해주세요.'); }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '확인 중…';

  let res;
  try {
    res = await api('studentLogin', { tabName: tab.sheetName, studentId: studentId, code: code });
  } catch (e) {
    return renderLogin(tab, '서버에 연결할 수 없습니다. 다시 시도해주세요.');
  }
  if (!res.success) { return renderLogin(tab, res.message || '로그인에 실패했습니다.'); }

  state.login = { studentId: studentId, studentName: res.studentName, code: code, master: !!res.master };
  saveLogin(studentId, code);
  renderForm(tab);
}

function buildFieldsHtml(inputs, antiPaste) {
  let sawText = false, sawFile = false;
  const textHead = '<div style="display:flex;align-items:center;gap:8px;margin:0 0 10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg><b style="font-size:14px;">과제 내용 작성</b></div>';
  const fileHead = '<div style="display:flex;align-items:center;gap:8px;margin:20px 0 10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg><b style="font-size:14px;">사진·영상 첨부</b></div>';

  return inputs.map(function (f, i) {
    const id = 'f_' + i;
    let head = '';
    if ((f.type === 'short' || f.type === 'long') && !sawText) { sawText = true; head = textHead; }
    if (f.type === 'file' && !sawFile) { sawFile = true; head = fileHead; }

    if (f.type === 'short') {
      return head + '<div class="field"><label for="' + id + '">' + escapeHtml(f.name) + '</label>' +
        '<input id="' + id + '" type="text" data-field="' + i + '"></div>';
    }
    if (f.type === 'long') {
      return head + '<div class="field"><label for="' + id + '">' + escapeHtml(f.name) + '</label>' +
        '<textarea id="' + id + '" data-field="' + i + '" data-antipaste="' + (antiPaste ? '1' : '0') + '"></textarea>' +
        '<div class="rowbetween">' +
          (antiPaste ? '<span class="badge-anti">복사-붙여넣기 제한</span>' : '<span></span>') +
          '<span class="charcount" id="cc_' + id + '">0자</span>' +
        '</div></div>';
    }
    return head + '<div class="field">' +
      '<label class="upload"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9C5BA" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>' +
        '<span>' + escapeHtml(f.name) + '</span><span class="hint">(최대 8MB)</span>' +
        '<input id="' + id + '" type="file" data-field="' + i + '" accept="image/*,.pdf,.doc,.docx,.hwp,.hwpx"></label>' +
      '<span class="hint" id="fn_' + id + '"></span></div>';
  }).join('');
}

function wireFieldEvents(tab, inputs) {
  inputs.forEach(function (f, i) {
    if (f.type !== 'long') return;
    const ta = document.getElementById('f_' + i);
    const cc = document.getElementById('cc_f_' + i);
    ta.addEventListener('input', function () { cc.textContent = ta.value.length + '자'; });
    if (tab.meta && tab.meta.antiPaste) {
      ta.addEventListener('paste', function (e) {
        e.preventDefault();
        state.antiPaste.pasteTries++;
        const text = (e.clipboardData || window.clipboardData).getData('text');
        state.antiPaste.maxChunk = Math.max(state.antiPaste.maxChunk, text.length);
        state.antiPaste.chunks++;
      });
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' || e.key === 'Delete') state.antiPaste.deletes++;
      });
    }
  });
  inputs.forEach(function (f, i) {
    if (f.type !== 'file') return;
    document.getElementById('f_' + i).addEventListener('change', function (e) {
      const file = e.target.files[0];
      document.getElementById('fn_f_' + i).textContent = file ? file.name : '';
    });
  });
  if (!state.antiPaste.startedAt) state.antiPaste.startedAt = Date.now();
}

function renderForm(tab, notice) {
  const status = (tab.meta && tab.meta.status) || 'open';
  const antiPaste = !!(tab.meta && tab.meta.antiPaste);
  const inputs = fieldInputs(tab);
  const fieldsHtml = buildFieldsHtml(inputs, antiPaste);

  render(
    peekBarHtml_() +
    '<div class="topbar"><span class="brand">' + escapeHtml(brandLabel()) + '</span>' +
      '<span class="pill ' + status + '">' + statusLabel(status) + '</span></div>' +
    '<div class="head"><h1 class="serif">' + escapeHtml(tab.sheetName) + '</h1>' +
      (tab.description ? '<p>' + escapeHtml(tab.description) + '</p>' : '') +
    '</div>' +
    '<div class="main">' +
      '<div class="identity rowbetween">' +
        '<div><b>' + escapeHtml(state.login.studentId) + ' · ' + escapeHtml(state.login.studentName) + '</b>' +
        '<small>학생코드로 확인됨</small></div>' +
        '<button class="linklike" id="logoutBtn" style="padding:4px 0;">로그아웃</button>' +
      '</div>' +
      (notice ? '<div class="msg error">' + escapeHtml(notice) + '</div>' : '') +
      '<div class="card">' + fieldsHtml + '</div>' +
      '<button class="btn" id="submitBtn" style="margin-bottom:10px;">제출하기</button>' +
      '<p style="text-align:center;"><span class="hint">제출 시 ' + escapeHtml(state.login.studentId) + ' ' + escapeHtml(state.login.studentName) + ' 이름으로 기록됩니다</span></p>' +
    '</div>' +
    '<div class="footer"><span>Made by Eagle Teacher · 교육 목적</span></div>'
  );

  wireFieldEvents(tab, inputs);
  document.getElementById('submitBtn').onclick = function () { doSubmit(tab, false); };
  document.getElementById('logoutBtn').onclick = function () {
    if (!confirm('로그아웃할까요? 다시 쓰려면 학번과 학생코드를 입력해야 합니다.')) return;
    clearLogin();
    state.login = null;
    renderLogin(tab);
  };
}

async function doSubmit(tab, confirmOverwrite) {
  if (isPeek_()) { return renderCurrentForm(tab, '마스터코드로는 둘러볼 수만 있어요. 제출은 학생 본인 코드로 해주세요.'); }
  const inputs = fieldInputs(tab);
  const values = tab.fields.map(function () { return ''; });
  values[0] = state.login.studentId;
  values[1] = state.login.studentName;

  const files = [];
  for (let i = 0; i < inputs.length; i++) {
    const idx = tab.fields.indexOf(inputs[i]);
    const f = inputs[i];
    if (f.type === 'file') {
      const input = document.getElementById('f_' + i);
      const file = input.files[0];
      if (file) {
        if (file.size > 8 * 1024 * 1024) { return renderCurrentForm(tab, '첨부파일은 8MB 이하만 가능합니다.'); }
        const base64 = await fileToBase64(file);
        files.push({ index: idx, name: file.name, mimeType: file.type, base64: base64 });
      }
    } else {
      values[idx] = document.getElementById('f_' + i).value;
    }
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '제출 중…';

  const payload = {
    tab: tab.sheetName,
    code: state.login.code,
    values: values,
    files: files,
    confirm: !!confirmOverwrite
  };
  if (tab.meta && tab.meta.antiPaste) {
    payload.trace = {
      v: 1,
      pasteTries: state.antiPaste.pasteTries,
      maxChunk: state.antiPaste.maxChunk,
      chunks: state.antiPaste.chunks,
      deletes: state.antiPaste.deletes,
      activeSec: Math.round((Date.now() - state.antiPaste.startedAt) / 1000)
    };
  }

  let res;
  try {
    res = await api('submit', payload);
  } catch (e) {
    btn.disabled = false; btn.textContent = '제출하기';
    return renderCurrentForm(tab, '서버에 연결할 수 없습니다. 다시 시도해주세요.');
  }

  if (res.duplicate) {
    const ok = confirm('이미 제출된 학번입니다 (' + (res.studentName || '') + '). 덮어쓸까요?');
    if (ok) return doSubmit(tab, true);
    btn.disabled = false; btn.textContent = '제출하기';
    return;
  }
  if (!res.success) {
    btn.disabled = false; btn.textContent = '제출하기';
    return renderCurrentForm(tab, res.message || '제출에 실패했습니다.');
  }

  if (state.globalMode) {
    let res2;
    try { res2 = await api('getMySubmissions', { studentId: state.login.studentId, code: state.login.code }); } catch (e) {}
    if (res2 && res2.success) {
      state.myTabs = res2.tabs || [];
      const updated = state.myTabs.find(function (t) { return t.sheetName === tab.sheetName; });
      if (updated) return renderSubmissionStatus(tab, updated);
    }
    return renderToday();
  }

  renderSuccess(tab, res.message);
}

function renderSuccess(tab, message) {
  render(
    '<div class="center-pad"><div class="card" style="text-align:center;">' +
      '<div class="success-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F7A3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>' +
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px;">제출 완료</div>' +
      '<p style="color:var(--text2);font-size:14px;margin:0;">' + escapeHtml(message || '제출이 완료되었습니다.') + '</p>' +
    '</div></div>'
  );
}

// ---------- OTP 입력칸 ----------

function otpBoxesHtml(count, numeric) {
  let html = '';
  for (let i = 0; i < count; i++) {
    html += '<input type="text" maxlength="1" autocomplete="one-time-code"' + (numeric ? ' inputmode="numeric"' : ' inputmode="text"') + '>';
  }
  return html;
}

function wireOtp(containerId, numeric) {
  const box = document.getElementById(containerId);
  const inputs = Array.prototype.slice.call(box.querySelectorAll('input'));
  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () {
      let v = inp.value.slice(-1);
      v = numeric ? v.replace(/[^0-9]/g, '') : v.toUpperCase().replace(/[^A-Z0-9]/g, '');
      inp.value = v;
      if (v && i < inputs.length - 1) inputs[i + 1].focus();
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
    });
    inp.addEventListener('paste', function (e) {
      e.preventDefault();
      let text = (e.clipboardData || window.clipboardData).getData('text');
      text = numeric ? text.replace(/[^0-9]/g, '') : text.toUpperCase().replace(/[^A-Z0-9]/g, '');
      for (let j = 0; j < text.length && (i + j) < inputs.length; j++) inputs[i + j].value = text[j];
      inputs[Math.min(i + text.length, inputs.length - 1)].focus();
    });
  });
}

function otpValue(containerId) {
  return Array.prototype.slice.call(document.querySelectorAll('#' + containerId + ' input'))
    .map(function (i) { return i.value; }).join('');
}

// ---------- 유틸 ----------

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

document.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-link]');
  if (!btn) return;
  const link = btn.getAttribute('data-link');
  navigator.clipboard.writeText(link).then(function () {
    const old = btn.textContent;
    btn.textContent = '복사됨';
    setTimeout(function () { btn.textContent = old; }, 1500);
  });
});

// ---------- PWA 설치 · 푸시 알림(FCM) · 공지 ----------

/* 파이어베이스 콘솔 «프로젝트 설정 → 일반 → 내 앱(웹)» 값. 비어 있으면 «알림 받기» 버튼은 숨겨집니다.
   sw.js 맨 위 FCM_CONFIG 에도 «똑같이» 채워야 합니다(앱이 닫혀 있을 때의 수신은 서비스워커가 처리). */
const FCM_CONFIG = { apiKey: '', authDomain: '', projectId: '', storageBucket: '', messagingSenderId: '', appId: '' };
const FCM_VAPID_KEY = '';
const NOTI_KEY = 'hyewon_noti_on';

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; paintExtras_(); });
window.addEventListener('appinstalled', function () { deferredInstall = null; paintExtras_(); });

function isStandalone_() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS_() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function notiOn_() {
  try { return window.Notification && Notification.permission === 'granted' && localStorage.getItem(NOTI_KEY) === '1'; } catch (e) { return false; }
}
function pushSupported_() {
  return !!(FCM_CONFIG.apiKey && FCM_VAPID_KEY && 'serviceWorker' in navigator && 'Notification' in window);
}

function paintExtras_() {
  const box = document.getElementById('extras');
  if (!box) return;
  let html = '';
  if (!isStandalone_()) {
    if (deferredInstall) html += '<button id="installBtn">홈 화면에 앱 설치하기</button>';
    else if (isIOS_()) html += '<p class="hint">아이폰: 공유 버튼 → «홈 화면에 추가»를 누르면 앱처럼 쓸 수 있어요.</p>';
  }
  if (pushSupported_() && !isPeek_()) {
    const on = notiOn_();
    html += '<button id="notiBtn" class="' + (on ? 'on' : '') + '">' + (on ? '알림 받는 중 (끄려면 누르세요)' : '알림 받기') + '</button>';
    html += '<p class="hint">' + (Notification.permission === 'denied'
      ? '알림이 차단돼 있어요 — 브라우저 설정에서 이 앱의 알림을 허용해 주세요.'
      : (isStandalone_() || !isIOS_() ? '켜 두면 앱을 닫아도 선생님 공지가 휴대폰에 떠요.' : '알림은 홈 화면에 설치한 뒤에 켤 수 있어요.')) + '</p>';
  }
  box.innerHTML = html;
  const ib = document.getElementById('installBtn');
  if (ib) ib.onclick = function () {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(function () { deferredInstall = null; paintExtras_(); });
  };
  const nb = document.getElementById('notiBtn');
  if (nb) nb.onclick = function () { notiOn_() ? notiDisable_() : notiEnable_(); };
}

function loadScript_(src) {
  return new Promise(function (res, rej) {
    if (document.querySelector('script[src="' + src + '"]')) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = function () { res(); }; s.onerror = function () { rej(new Error('load ' + src)); };
    document.head.appendChild(s);
  });
}

async function notiEnable_() {
  if (isIOS_() && !isStandalone_()) { alert('아이폰은 먼저 홈 화면에 앱을 설치해야 알림을 켤 수 있어요.'); return; }
  const nb = document.getElementById('notiBtn');
  if (nb) nb.disabled = true;
  try {
    if (!window.firebase || !firebase.messaging) {
      await loadScript_('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript_('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    }
    const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (perm !== 'granted') { alert('알림 창에서 «허용»을 눌러야 켜져요.'); return; }
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FCM_CONFIG);
    const reg = await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error('토큰 없음');
    const r = await api('saveNotiToken', { studentId: state.login.studentId, code: state.login.code, token: token, ua: navigator.userAgent });
    if (!r.success) { alert(r.message || '알림을 켜지 못했어요.'); return; }
    localStorage.setItem(NOTI_KEY, '1');
  } catch (e) {
    console.warn('알림 켜기 실패', e);
    alert('알림을 켜지 못했어요. 잠시 후 다시 시도해 주세요.');
  } finally {
    paintExtras_();
  }
}

async function notiDisable_() {
  try { localStorage.setItem(NOTI_KEY, '0'); } catch (e) {}
  try {
    if (window.firebase && firebase.apps && firebase.apps.length) {
      const token = await firebase.messaging().getToken({ vapidKey: FCM_VAPID_KEY });
      if (token) { api('removeNotiToken', { token: token }); firebase.messaging().deleteToken().catch(function () {}); }
    }
  } catch (e) {}
  paintExtras_();
}

async function loadNotices_() {
  const area = document.getElementById('noticeArea');
  if (!area || !state.login || isPeek_()) return;
  try {
    const r = await api('getNotices', { studentId: state.login.studentId, code: state.login.code });
    if (!r || !r.success || !r.notices || !r.notices.length) return;
    const n = r.notices[0];
    area.innerHTML = '<div class="notice-box"><b>' + escapeHtml(n.title) + '</b>' +
      (n.body ? '<p>' + escapeHtml(n.body) + '</p>' : '') + '<small>' + escapeHtml(n.at) + '</small></div>';
  } catch (e) {}
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}

boot();
</script>
